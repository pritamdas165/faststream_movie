<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastStream | Premium Movies</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #e50914; --bg: #000000; --card-bg: #141414; --text: #ffffff; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }
        
        /* Navbar */
        header { padding: 15px 4%; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; transition: background 0.3s; }
        .logo { font-size: 24px; font-weight: 800; color: var(--primary); text-decoration: none; letter-spacing: 1px; }
        .nav-links a { color: white; text-decoration: none; font-size: 14px; margin-left: 20px; font-weight: 500; }

        /* Search Bar */
        .search-container { padding: 20px 4%; }
        #searchInput { width: 100%; padding: 12px 20px; border-radius: 4px; border: none; background: #333; color: white; outline: none; font-size: 16px; box-sizing: border-box; }

        /* Slider */
        #slider { width: 100%; height: 280px; overflow: hidden; position: relative; }
        #slideContent { display: flex; transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1); height: 100%; }
        .slide-item { min-width: 100%; position: relative; cursor: pointer; }
        .slide-item img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
        .slide-info { position: absolute; bottom: 30px; left: 4%; text-shadow: 2px 2px 10px #000; }

        /* Genre Buttons */
        .genre-container { display: flex; overflow-x: auto; padding: 15px 4%; gap: 10px; scrollbar-width: none; }
        .genre-btn { background: #222; color: #aaa; padding: 8px 18px; border-radius: 4px; cursor: pointer; white-space: nowrap; font-size: 13px; transition: 0.3s; border: none; }
        .genre-btn.active { background: white; color: black; font-weight: bold; }

        /* Movie Grid */
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; padding: 0 4% 40px; }
        .movie-card { background: var(--card-bg); border-radius: 4px; overflow: hidden; cursor: pointer; transition: 0.3s ease; position: relative; }
        .movie-card:hover { transform: scale(1.08); z-index: 10; }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .badge { position: absolute; top: 5px; right: 5px; background: var(--primary); color: white; font-size: 10px; padding: 2px 6px; border-radius: 2px; font-weight: bold; }
        .info { padding: 8px; }
        .info h3 { font-size: 12px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }

        @media (min-width: 768px) { #slider { height: 450px; } .movie-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; } }
    </style>
</head>
<body>

    <header id="navbar">
        <a href="index.html" class="logo">FASTSTREAM</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="request.html"><i class="fas fa-plus-circle"></i> Request</a>
        </div>
    </header>

    <div id="slider"><div id="slideContent"></div></div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search movies, titles..." onkeyup="searchMovie()">
    </div>

    <div class="genre-container" id="genres">
        <div class="genre-btn active" onclick="filterGenre('All', this)">All</div>
        <div class="genre-btn" onclick="filterGenre('Action', this)">Action</div>
        <div class="genre-btn" onclick="filterGenre('South', this)">South Indian</div>
        <div class="genre-btn" onclick="filterGenre('Hindi', this)">Hindi Dubbed</div>
    </div>

    <div class="movie-grid" id="movieGrid"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
            authDomain: "movie-project-b78b4.firebaseapp.com",
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
            projectId: "movie-project-b78b4",
            storageBucket: "movie-project-b78b4.firebasestorage.app",
            messagingSenderId: "819696212001",
            appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Navbar scroll effect
        window.onscroll = function() {
            if (document.body.scrollTop > 50 || document.documentElement.scrollTop > 50) {
                document.getElementById("navbar").style.background = "#000";
            } else {
                document.getElementById("navbar").style.background = "linear-gradient(to bottom, rgba(0,0,0,0.8), transparent)";
            }
        };

        // Fetch Movies
        db.ref('movies').on('value', (snap) => {
            const grid = document.getElementById('movieGrid');
            const slider = document.getElementById('slideContent');
            grid.innerHTML = ''; slider.innerHTML = '';
            let count = 0;

            snap.forEach((child) => {
                const m = child.val();
                const mId = child.key;

                if(count < 5) {
                    slider.innerHTML += `<div class="slide-item" onclick="location.href='go.html?id=${mId}'">
                        <img src="${m.poster}"><div class="slide-info"><h2>${m.title}</h2></div></div>`;
                    count++;
                }

                grid.innerHTML += `<div class="movie-card" data-genre="${m.genre || ''}" onclick="location.href='go.html?id=${mId}'">
                    <div class="badge">${m.quality || 'HD'}</div>
                    <img src="${m.poster}"><div class="info"><h3>${m.title}</h3></div></div>`;
            });
        });

        // Search & Filter
        function searchMovie() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.movie-card').forEach(c => {
                c.style.display = c.innerText.toLowerCase().includes(input) ? "block" : "none";
            });
        }

        function filterGenre(genre, btn) {
            document.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.movie-card').forEach(c => {
                const cGenre = c.getAttribute('data-genre');
                c.style.display = (genre === 'All' || cGenre.includes(genre)) ? "block" : "none";
            });
        }

        // Auto Slider
        let slideIdx = 0;
        setInterval(() => {
            slideIdx = (slideIdx + 1) % 5;
            const sc = document.getElementById('slideContent');
            if(sc) sc.style.transform = `translateX(-${slideIdx * 100}%)`;
        }, 5000);
    </script>
</body>
</html>
