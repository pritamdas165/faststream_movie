<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastStream | Premium Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #e50914; --bg: #080808; --card-bg: #1a1a1a; --glass: rgba(255, 255, 255, 0.05); }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: white; margin: 0; overflow-x: hidden; }

        /* Premium Navbar */
        header { 
            padding: 15px 5%; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); 
            display: flex; justify-content: space-between; align-items: center; 
            position: fixed; top: 0; width: 100%; z-index: 1000; box-sizing: border-box;
            backdrop-filter: blur(10px);
        }
        .logo { font-size: 26px; font-weight: 900; color: var(--primary); text-decoration: none; letter-spacing: 1.5px; }
        .nav-links a { color: #ccc; text-decoration: none; font-size: 14px; margin-left: 20px; transition: 0.3s; }
        .nav-links a:hover { color: var(--primary); }

        /* Premium Slider */
        #slider { width: 100%; height: 75vh; position: relative; overflow: hidden; }
        #slideContent { display: flex; height: 100%; transition: 1s cubic-bezier(0.6, 0, 0.2, 1); }
        .slide-item { min-width: 100%; position: relative; }
        .slide-item img { width: 100%; height: 100%; object-fit: cover; }
        .slide-overlay { 
            position: absolute; bottom: 0; left: 0; width: 100%; height: 70%; 
            background: linear-gradient(to top, var(--bg) 10%, transparent); 
        }
        .slide-info { position: absolute; bottom: 10%; left: 5%; max-width: 600px; }
        .slide-info h2 { font-size: 3rem; margin: 0; text-transform: uppercase; }

        /* Search & Filters */
        .controls { padding: 30px 5% 10px; }
        .search-box { 
            background: var(--glass); border: 1px solid #333; padding: 12px 20px; 
            border-radius: 30px; display: flex; align-items: center; gap: 10px;
        }
        .search-box input { background: none; border: none; color: white; width: 100%; outline: none; font-size: 16px; }

        .genre-container { display: flex; gap: 10px; padding: 20px 5%; overflow-x: auto; scrollbar-width: none; }
        .genre-btn { 
            background: #1a1a1a; color: white; padding: 10px 22px; border-radius: 5px; 
            border: 1px solid #333; cursor: pointer; transition: 0.3s; font-size: 14px;
        }
        .genre-btn.active { background: var(--primary); border-color: var(--primary); }

        /* Premium Grid */
        .movie-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 20px; padding: 20px 5% 50px; 
        }
        .movie-card { 
            position: relative; border-radius: 8px; overflow: hidden; 
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .movie-card:hover { transform: translateY(-10px) scale(1.05); }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .movie-badge { 
            position: absolute; top: 10px; left: 10px; background: var(--primary); 
            font-size: 11px; padding: 3px 8px; border-radius: 3px; font-weight: bold; 
        }
        .card-info { 
            position: absolute; bottom: 0; width: 100%; padding: 15px 10px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9)); 
            opacity: 0; transition: 0.3s;
        }
        .movie-card:hover .card-info { opacity: 1; }
        .card-info h3 { font-size: 13px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        @media (max-width: 600px) {
            #slider { height: 40vh; }
            .slide-info h2 { font-size: 1.5rem; }
            .movie-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
        }
    </style>
</head>
<body>

    <header id="navbar">
        <a href="index.html" class="logo">FASTSTREAM</a>
        <div class="nav-links">
            <a href="request.html">REQUEST</a>
        </div>
    </header>

    <div id="slider"><div id="slideContent"></div></div>

    <div class="controls">
        <div class="search-box">
            <i class="fas fa-search" style="color:#666"></i>
            <input type="text" id="searchInput" placeholder="Search by title..." onkeyup="searchMovie()">
        </div>
    </div>

    <div class="genre-container" id="genres">
        <button class="genre-btn active" onclick="filterGenre('All', this)">All</button>
        <button class="genre-btn" onclick="filterGenre('Action', this)">Action</button>
        <button class="genre-btn" onclick="filterGenre('South', this)">South Indian</button>
        <button class="genre-btn" onclick="filterGenre('Hindi', this)">Hindi Dubbed</button>
    </div>

    <div class="movie-grid" id="movieGrid"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
            authDomain: "movie-project-b78b4.firebaseapp.com",
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
            projectId: "movie-project-b78b4",
            storageBucket: "movie-project-b78b4.firebasestorage.app",
            messagingSenderId: "819696212001",
            appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Load Movies
        db.ref('movies').on('value', (snap) => {
            const grid = document.getElementById('movieGrid');
            const slider = document.getElementById('slideContent');
            grid.innerHTML = ''; slider.innerHTML = '';
            let count = 0;

            snap.forEach((child) => {
                const m = child.val();
                const mId = child.key;

                // Slider (Latest 5)
                if(count < 5) {
                    slider.innerHTML += `
                    <div class="slide-item" onclick="location.href='go.html?id=${mId}'">
                        <img src="${m.poster}">
                        <div class="slide-overlay"></div>
                        <div class="slide-info"><h2>${m.title}</h2></div>
                    </div>`;
                    count++;
                }

                // Movie Grid
                grid.innerHTML += `
                <div class="movie-card" data-genre="${m.genre || ''}" onclick="location.href='go.html?id=${mId}'">
                    <span class="movie-badge">${m.quality || 'HD'}</span>
                    <img src="${m.poster}">
                    <div class="card-info"><h3>${m.title}</h3></div>
                </div>`;
            });
        });

        function searchMovie() {
            let val = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.movie-card').forEach(c => {
                c.style.display = c.innerText.toLowerCase().includes(val) ? "block" : "none";
            });
        }

        function filterGenre(genre, btn) {
            document.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.movie-card').forEach(c => {
                const cGenre = c.getAttribute('data-genre');
                c.style.display = (genre === 'All' || cGenre.includes(genre)) ? "block" : "none";
            });
        }

        // Auto Slider Animation
        let idx = 0;
        setInterval(() => {
            idx = (idx + 1) % 5;
            const sc = document.getElementById('slideContent');
            if(sc) sc.style.transform = `translateX(-${idx * 100}%)`;
        }, 5000);
    </script>
</body>
</html>
