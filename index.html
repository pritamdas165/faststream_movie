<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastStream | Premium Home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #e50914; --bg: #121212; --card-bg: #1e1e1e; --nav-bg: rgba(20, 20, 20, 0.95); --sidebar-bg: #1a1a1a; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: radial-gradient(circle at top, #1c1c1c 0%, #121212 100%); color: white; margin: 0; overflow-x: hidden; }

        /* Navbar & Menu Button */
        header { padding: 15px 5%; background: var(--nav-bg); display: flex; align-items: center; position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(15px); border-bottom: 1px solid #252525; gap: 20px; }
        .menu-btn { font-size: 24px; cursor: pointer; color: white; transition: 0.3s; }
        .menu-btn:hover { color: var(--primary); }
        .logo { font-size: 24px; font-weight: 900; color: var(--primary); text-decoration: none; letter-spacing: 1px; flex-grow: 1; }

        /* Sidebar Menu Styles */
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: var(--sidebar-bg); z-index: 2000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 10px 0 20px rgba(0,0,0,0.5); overflow-y: auto; }
        .sidebar.active { left: 0; }
        .sidebar-header { padding: 25px; background: #111; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; }
        .sidebar-menu li { border-bottom: 1px solid #252525; }
        .sidebar-menu li a { display: flex; align-items: center; padding: 15px 25px; color: #ccc; text-decoration: none; font-size: 15px; font-weight: 500; transition: 0.3s; }
        .sidebar-menu li a i { width: 25px; color: var(--primary); margin-right: 10px; font-size: 18px; }
        .sidebar-menu li a:hover { background: #252525; color: white; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1500; display: none; backdrop-filter: blur(5px); }
        .overlay.active { display: block; }

        /* Swiper & Grid (Existing Styles) */
        .swiper { width: 100%; height: 50vh; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; padding: 20px 5%; }
        .movie-card { border-radius: 8px; overflow: hidden; background: var(--card-bg); border: 1px solid #282828; position: relative; cursor: pointer; }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-info { padding: 8px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        @media (max-width: 600px) { .movie-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; } }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span style="font-weight: 900; color: var(--primary); font-size: 20px;">FASTSTREAM</span>
            <i class="fas fa-times" style="cursor:pointer" onclick="toggleMenu()"></i>
        </div>
        <ul class="sidebar-menu">
            <li><a href="index.html"><i class="fas fa-home"></i> FastStream Home 🏠</a></li>
            <li><a href="#" onclick="filterGenre('Bollywood')"><i class="fas fa-film"></i> Bollywood</a></li>
            <li><a href="#" onclick="filterGenre('Hollywood')"><i class="fas fa-globe"></i> Hollywood</a></li>
            <li><a href="#" onclick="filterGenre('Hindi Dubbed')"><i class="fas fa-microphone"></i> Hindi Dubbed</a></li>
            <li><a href="#" onclick="filterGenre('South Indian')"><i class="fas fa-bolt"></i> South Hindi</a></li>
            <li><a href="#"><i class="fas fa-tv"></i> Web Series</a></li>
            <li><a href="#"><i class="fas fa-list"></i> GENRES <i class="fas fa-chevron-down" style="margin-left:auto; font-size:12px;"></i></a></li>
            <li><a href="request.html"><i class="fas fa-plus-circle"></i> Request Movie</a></li>
        </ul>
    </div>

    <header>
        <div class="menu-btn" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
        <a href="index.html" class="logo">FASTSTREAM</a>
    </header>

    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="sliderWrapper"></div>
        <div class="swiper-pagination"></div>
    </div>

    <div class="movie-grid" id="movieGrid"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        const firebaseConfig = { /* Apnar Firebase Config Ekhane thakbe */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        db.ref('movies').on('value', (snap) => {
            const grid = document.getElementById('movieGrid');
            const slider = document.getElementById('sliderWrapper');
            grid.innerHTML = ''; slider.innerHTML = '';
            snap.forEach((child) => {
                const m = child.val(); const id = child.key;
                slider.innerHTML += `<div class="swiper-slide" onclick="location.href='go.html?id=${id}'"><img src="${m.poster}"></div>`;
                grid.innerHTML += `<div class="movie-card" data-genre="${m.genre || ''}" onclick="location.href='go.html?id=${id}'"><img src="${m.poster}"><div class="card-info">${m.title}</div></div>`;
            });
            new Swiper(".mySwiper", { loop: true, autoplay: { delay: 3000 }, pagination: { el: ".swiper-pagination", clickable: true } });
        });

        function filterGenre(genre) {
            toggleMenu();
            document.querySelectorAll('.movie-card').forEach(c => {
                const cGenre = c.getAttribute('data-genre');
                c.style.display = (genre === 'All' || cGenre.includes(genre)) ? "block" : "none";
            });
        }
    </script>
</body>
</html>
