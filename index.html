<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastStream | Watch & Download Movies</title>
    <script>(function(s){s.dataset.zone='10626442',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #e50914; --bg: #0a0a0b; --card-bg: #161618; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 0; }
        header { padding: 15px; background: rgba(0,0,0,0.9); border-bottom: 2px solid var(--primary); text-align: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 26px; font-weight: bold; color: var(--primary); letter-spacing: 2px; }
        .search-container { padding: 10px; display: flex; justify-content: center; background: #000; }
        #search { width: 90%; max-width: 500px; padding: 10px 15px; border-radius: 20px; border: 1px solid #333; background: #222; color: white; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 20px; justify-content: center; }
        .movie-card { background: var(--card-bg); border-radius: 10px; overflow: hidden; position: relative; transition: 0.3s; border: 1px solid #222; cursor: pointer; }
        .movie-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .badge { position: absolute; top: 8px; right: 8px; background: var(--primary); color: white; font-size: 10px; padding: 3px 7px; border-radius: 4px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .info { padding: 10px; text-align: center; }
        .info h3 { font-size: 13px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        @media (min-width: 768px) { .movie-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }
    </style>
</head>
<body>
    <header><div class="logo">FASTSTREAM</div></header>
    <div class="search-container">
        <input type="text" id="search" placeholder="Search movies..." onkeyup="searchMovie()">
    </div>
    <div class="movie-grid" id="movieGrid"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
            authDomain: "movie-project-b78b4.firebaseapp.com",
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
            projectId: "movie-project-b78b4",
            storageBucket: "movie-project-b78b4.firebasestorage.app",
            messagingSenderId: "819696212001",
            appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('movies').on('value', (snap) => {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            snap.forEach((child) => {
                const m = child.val();
                grid.innerHTML += `
                    <div class="movie-card" onclick="location.href='go.html?url=${btoa(m.link)}'">
                        <div class="badge">${m.quality || 'HD'}</div>
                        <img src="${m.poster}" alt="${m.title}">
                        <div class="info"><h3>${m.title}</h3></div>
                    </div>`;
            });
        });

        function searchMovie() {
            let input = document.getElementById('search').value.toLowerCase();
            let cards = document.getElementsByClassName('movie-card');
            for(let card of cards) {
                card.style.display = card.innerText.toLowerCase().includes(input) ? "block" : "none";
            }
        }
    </script>
</body>
</html>
