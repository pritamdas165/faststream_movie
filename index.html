<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastStream | Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #e50914; --bg: #121212; --card-bg: #1e1e1e; --border: #333; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .header h1 { color: var(--primary); font-size: 24px; margin: 0; }
        .form-card { background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        input, select { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 15px; background: #252525; border: 1px solid var(--border); color: white; border-radius: 6px; outline: none; box-sizing: border-box; }
        input:focus { border-color: var(--primary); }
        label { font-size: 14px; color: #aaa; font-weight: bold; }
        .screenshot-group { border: 1px dashed #444; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #b20710; transform: translateY(-2px); }
        .movie-item { background: #1a1a1a; padding: 15px; border-radius: 8px; display: flex; align-items: center; gap: 15px; margin-bottom: 10px; border: 1px solid var(--border); }
        .movie-item img { width: 50px; height: 70px; object-fit: cover; border-radius: 4px; }
        .movie-info { flex-grow: 1; }
        .del-btn { background: #333; color: #ff4444; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1><i class="fas fa-user-shield"></i> Admin Panel</h1>
            <a href="index.html" style="color:#aaa; text-decoration:none; font-size:14px;">View Site</a>
        </div>

        <div class="form-card">
            <label>Movie Title</label>
            <input type="text" id="title" placeholder="e.g. Animal (2023)">

            <div class="grid-inputs">
                <div>
                    <label>Genre</label>
                    <select id="genre">
                        <option value="Action">Action</option>
                        <option value="Bollywood">Bollywood</option>
                        <option value="Hollywood">Hollywood</option>
                        <option value="South Indian">South Indian</option>
                        <option value="Hindi Dubbed">Hindi Dubbed</option>
                    </select>
                </div>
                <div>
                    <label>Quality</label>
                    <input type="text" id="quality" placeholder="e.g. 1080p | 4K">
                </div>
            </div>

            <label>Poster Image URL</label>
            <input type="text" id="poster" placeholder="https://image-link.com/poster.jpg">

            <div class="screenshot-group">
                <label><i class="fas fa-images"></i> Movie Screenshots (URLs)</label>
                <input type="text" id="ss1" placeholder="Screenshot Link 1">
                <input type="text" id="ss2" placeholder="Screenshot Link 2">
                <input type="text" id="ss3" placeholder="Screenshot Link 3">
            </div>

            <label>Download Link</label>
            <input type="text" id="download" placeholder="https://download-link.com">

            <button onclick="addMovie()"><i class="fas fa-plus"></i> PUBLISH MOVIE</button>
        </div>

        <div class="movie-list" style="margin-top: 30px;">
            <h3>Manage Movies</h3>
            <div id="movieContainer"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
          authDomain: "movie-project-b78b4.firebaseapp.com",
          databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
          projectId: "movie-project-b78b4",
          storageBucket: "movie-project-b78b4.firebasestorage.app",
          messagingSenderId: "819696212001",
          appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function addMovie() {
            const movieData = {
                title: document.getElementById('title').value,
                genre: document.getElementById('genre').value,
                quality: document.getElementById('quality').value,
                poster: document.getElementById('poster').value,
                download: document.getElementById('download').value,
                screenshots: [
                    document.getElementById('ss1').value,
                    document.getElementById('ss2').value,
                    document.getElementById('ss3').value
                ].filter(link => link !== ""), // Khali link bad dewa hobe
                timestamp: Date.now()
            };

            if(!movieData.title || !movieData.poster) return alert("Title and Poster required!");

            db.ref('movies').push(movieData).then(() => {
                alert("Movie Added with Screenshots!");
                location.reload();
            });
        }

        db.ref('movies').on('value', (snap) => {
            const container = document.getElementById('movieContainer');
            container.innerHTML = '';
            snap.forEach((child) => {
                const m = child.val();
                container.innerHTML += `
                    <div class="movie-item">
                        <img src="${m.poster}">
                        <div class="movie-info">
                            <h4>${m.title}</h4>
                            <p>${m.genre} | ${m.quality}</p>
                        </div>
                        <button class="del-btn" onclick="deleteMovie('${child.key}')"><i class="fas fa-trash"></i></button>
                    </div>`;
            });
        });

        function deleteMovie(id) {
            if(confirm("Delete this movie?")) db.ref('movies/' + id).remove();
        }
    </script>
</body>
</html>
