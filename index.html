<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastStream | Secure Redirect</title>
    
    <script src="//your-popunder-tag.com/script.js" data-zone="YOUR_ZONE_ID" async></script>

    <style>
        :root {
            --bg: #0a0a0b;
            --card: #161618;
            --accent: #e50914;
            --text-dim: #a0a0a0;
        }

        body {
            background-color: var(--bg);
            color: #ffffff;
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .redirect-card {
            background: var(--card);
            padding: 40px 30px;
            border-radius: 24px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            border: 1px solid #2a2a2c;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Fake Loader Styling */
        .loader-wrapper { margin: 20px 0; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(229, 9, 20, 0.2);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .status-text {
            font-size: 0.95rem;
            color: var(--text-dim);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .btn-continue {
            display: none; /* Hidden during loading */
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
        }

        .btn-continue:hover {
            transform: translateY(-2px);
            background: #ff0f1b;
            box-shadow: 0 6px 20px rgba(229, 9, 20, 0.4);
        }

        .adblock-notice {
            display: none;
            margin-top: 15px;
            font-size: 0.75rem;
            color: #ffc107;
            background: rgba(255, 193, 7, 0.1);
            padding: 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="redirect-card">
        <div id="loader-area">
            <div class="spinner"></div>
            <div class="status-text" id="status">Verifying secure link...</div>
        </div>

        <button id="continue-btn" class="btn-continue">Continue to Movie</button>
        
        <div id="adblock-msg" class="adblock-notice">
            AdBlock detected: Verification taking longer than usual...
        </div>
    </div>

    <script>
        // CONFIGURATION
        const PROPELLER_DIRECT_LINK = "https://your-direct-link-url.com/click"; // Paste your Direct Link here
        const NORMAL_DELAY = 3000; // 3 seconds
        const ADBLOCK_DELAY = 6000; // 6 seconds total if adblock is on
        
        // 1. Detect Movie URL
        const urlParams = new URLSearchParams(window.location.search);
        const targetUrl = decodeURIComponent(urlParams.get('url'));

        // 2. Anti-Adblock Check
        let isAdblock = false;
        async function checkAdBlock() {
            try {
                // Try to fetch a common ad-serving script name
                await fetch('https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js', { mode: 'no-cors' });
            } catch (e) {
                isAdblock = true;
                document.getElementById('adblock-msg').style.display = 'block';
            }
            startFlow();
        }

        // 3. Logic Flow
        function startFlow() {
            const delay = isAdblock ? ADBLOCK_DELAY : NORMAL_DELAY;
            
            // Status Update Sequence
            setTimeout(() => document.getElementById('status').innerText = "Preparing stream...", 1500);

            // Show Button after Delay
            setTimeout(() => {
                document.getElementById('loader-area').style.display = 'none';
                document.getElementById('continue-btn').style.display = 'block';
            }, delay);
        }

        // 4. Click Handling (The Monetization Engine)
        document.getElementById('continue-btn').addEventListener('click', function() {
            if (!targetUrl || targetUrl === "null") {
                alert("Error: Link expired. Return to home.");
                return;
            }

            // MONETIZATION STEP:
            // 1. Open Direct Link in a NEW tab
            window.open(PROPELLER_DIRECT_LINK, '_blank');

            // 2. Redirect the CURRENT tab to the Movie URL
            // Using a tiny timeout ensures the pop-under/direct link registers properly
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 100);
        });

        // 5. One Pop-under per 24h Logic (Session Control)
        function handlePopFrequency() {
            const lastPop = localStorage.getItem('last_pop_time');
            const now = new Date().getTime();
            
            // If more than 24 hours have passed or first visit
            if (!lastPop || (now - lastPop) > (24 * 60 * 60 * 1000)) {
                // Let the Propeller Pop-under script run naturally
                localStorage.setItem('last_pop_time', now);
            } else {
                // Logic to suppress popunder if possible (Propeller usually handles this via dashboard)
                console.log("Ad Frequency Capped for this user.");
            }
        }

        window.onload = () => {
            handlePopFrequency();
            checkAdBlock();
        };
    </script>
</body>
</html>
