<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastStream | Premium Home</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { 
            --primary: #e50914; 
            --bg: #121212; /* Premium Matte Dark */
            --card-bg: #1e1e1e; 
            --nav-bg: rgba(20, 20, 20, 0.95);
        }

        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            background: radial-gradient(circle at top, #1c1c1c 0%, #121212 100%); 
            color: white; 
            margin: 0; 
            overflow-x: hidden;
        }

        /* Premium Navbar */
        header { 
            padding: 15px 5%; 
            background: var(--nav-bg); 
            display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 1000; 
            backdrop-filter: blur(15px);
            border-bottom: 1px solid #252525;
        }
        .logo { font-size: 26px; font-weight: 900; color: var(--primary); text-decoration: none; letter-spacing: 1.5px; }
        .nav-links a { color: #ccc; text-decoration: none; font-size: 14px; margin-left: 20px; transition: 0.3s; }
        .nav-links a:hover { color: var(--primary); }

        /* Hero Swiper Slider */
        .swiper { width: 100%; height: 65vh; position: relative; }
        .swiper-slide { position: relative; cursor: pointer; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }
        .slide-overlay { 
            position: absolute; bottom: 0; left: 0; width: 100%; height: 70%; 
            background: linear-gradient(to top, var(--bg) 10%, transparent); 
        }
        .slide-info { position: absolute; bottom: 15%; left: 5%; max-width: 80%; }
        .slide-info h2 { font-size: 2.5rem; margin: 0; text-transform: uppercase; text-shadow: 2px 2px 20px #000; }

        /* Search & Filters */
        .controls { padding: 30px 5% 10px; }
        .search-box { 
            background: #222; border: 1px solid #333; padding: 12px 20px; 
            border-radius: 30px; display: flex; align-items: center; gap: 10px;
        }
        .search-box input { background: none; border: none; color: white; width: 100%; outline: none; font-size: 16px; }

        .genre-container { display: flex; gap: 10px; padding: 10px 5%; overflow-x: auto; scrollbar-width: none; }
        .genre-btn { 
            background: #1e1e1e; color: #aaa; padding: 10px 22px; border-radius: 5px; 
            border: 1px solid #333; cursor: pointer; transition: 0.3s; font-size: 14px; white-space: nowrap;
        }
        .genre-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Movie Grid */
        .movie-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
            gap: 15px; padding: 20px 5% 50px; 
        }
        .movie-card { 
            position: relative; border-radius: 8px; overflow: hidden; 
            transition: 0.4s; cursor: pointer;
            background: var(--card-bg);
            border: 1px solid #282828;
        }
        .movie-card:hover { transform: scale(1.05); border-color: var(--primary); box-shadow: 0 0 15px rgba(229, 9, 20, 0.2); }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .movie-badge { 
            position: absolute; top: 10px; left: 10px; background: var(--primary); 
            font-size: 10px; padding: 3px 8px; border-radius: 3px; font-weight: bold; 
        }
        .card-info { padding: 10px; background: var(--card-bg); }
        .card-info h3 { font-size: 12px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ddd; }

        @media (max-width: 600px) {
            .swiper { height: 40vh; }
            .slide-info h2 { font-size: 1.4rem; }
            .movie-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">FASTSTREAM</a>
        <div class="nav-links">
            <a href="request.html"><i class="fas fa-plus-circle"></i> REQUEST</a>
        </div>
    </header>

    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="sliderWrapper"></div>
        <div class="swiper-pagination"></div>
    </div>

    <div class="controls">
        <div class="search-box">
            <i class="fas fa-search" style="color:#666"></i>
            <input type="text" id="searchInput" placeholder="Search movies..." onkeyup="searchMovie()">
        </div>
    </div>

    <div class="genre-container" id="genres">
        <button class="genre-btn active" onclick="filterGenre('All', this)">All</button>
        <button class="genre-btn" onclick="filterGenre('Action', this)">Action</button>
        <button class="genre-btn" onclick="filterGenre('South', this)">South Indian</button>
        <button class="genre-btn" onclick="filterGenre('Hindi', this)">Hindi Dubbed</button>
    </div>

    <div class="movie-grid" id="movieGrid"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
            authDomain: "movie-project-b78b4.firebaseapp.com",
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
            projectId: "movie-project-b78b4",
            storageBucket: "movie-project-b78b4.firebasestorage.app",
            messagingSenderId: "819696212001",
            appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('movies').on('value', (snap) => {
            const grid = document.getElementById('movieGrid');
            const slider = document.getElementById('sliderWrapper');
            grid.innerHTML = ''; slider.innerHTML = '';
            let count = 0;

            snap.forEach((child) => {
                const m = child.val();
                const id = child.key;

                if(count < 5) {
                    slider.innerHTML += `
                    <div class="swiper-slide" onclick="location.href='go.html?id=${id}'">
                        <img src="${m.poster}">
                        <div class="slide-overlay"></div>
                        <div class="slide-info"><h2>${m.title}</h2></div>
                    </div>`;
                    count++;
                }

                grid.innerHTML += `
                <div class="movie-card" data-genre="${m.genre || ''}" onclick="location.href='go.html?id=${id}'">
                    <span class="movie-badge">${m.quality || 'HD'}</span>
                    <img src="${m.poster}">
                    <div class="card-info"><h3>${m.title}</h3></div>
                </div>`;
            });

            new Swiper(".mySwiper", {
                loop: true,
                autoplay: { delay: 4000, disableOnInteraction: false },
                pagination: { el: ".swiper-pagination", clickable: true },
            });
        });

        function searchMovie() {
            let val = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.movie-card').forEach(c => {
                c.style.display = c.innerText.toLowerCase().includes(val) ? "block" : "none";
            });
        }

        function filterGenre(genre, btn) {
            document.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.movie-card').forEach(c => {
                const cGenre = c.getAttribute('data-genre');
                c.style.display = (genre === 'All' || cGenre.includes(genre)) ? "block" : "none";
            });
        }
    </script>
</body>
</html>
