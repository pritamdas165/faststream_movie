<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastStream | Watch Movies</title>
    <style>
        :root { --primary: #e50914; --bg: #0f1014; --card: #1c1d24; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; }
        
        .header { text-align: center; padding-bottom: 30px; }
        .header h1 { color: var(--primary); font-size: 32px; margin: 0; }

        /* Movie Grid Layout */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: auto;
        }

        /* Movie Card Style */
        .movie-card {
            background: var(--card);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s;
            border: 1px solid #333;
            text-decoration: none;
            color: white;
        }
        .movie-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        
        .movie-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
        }
        
        .movie-info { padding: 10px; text-align: center; }
        .movie-info h3 { font-size: 14px; margin: 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .btn-watch {
            display: block;
            background: var(--primary);
            color: white;
            padding: 8px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 5px;
        }

        /* Loading Spinner */
        #loader { text-align: center; margin-top: 50px; font-size: 18px; color: #888; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎥 FastStream</h1>
        <p>Latest Movies & Series</p>
    </div>

    <div id="loader">Loading Movies...</div>
    <div class="movie-grid" id="movieList"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // Apnar Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
            authDomain: "movie-project-b78b4.firebaseapp.com",
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
            projectId: "movie-project-b78b4",
            storageBucket: "movie-project-b78b4.firebasestorage.app",
            messagingSenderId: "819696212001",
            appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Fetching Data from Firebase
        const movieList = document.getElementById('movieList');
        const loader = document.getElementById('loader');

        db.ref('movies').on('value', (snapshot) => {
            movieList.innerHTML = "";
            loader.style.display = "none";
            
            const data = snapshot.val();
            if (data) {
                Object.keys(data).reverse().forEach(key => {
                    const movie = data[key];
                    
                    // Movie Card Creating
                    const card = `
                        <a href="${movie.link}" class="movie-card" target="_blank">
                            <img src="${movie.poster}" onerror="this.src='https://via.placeholder.com/500x750?text=No+Poster'">
                            <div class="movie-info">
                                <h3>${movie.title}</h3>
                                <span class="btn-watch">DOWNLOAD NOW</span>
                            </div>
                        </a>
                    `;
                    movieList.innerHTML += card;
                });
            } else {
                movieList.innerHTML = "<p style='text-align:center; width:100%;'>No movies found. Add from Admin Panel!</p>";
            }
        });
    </script>
</body>
</html>
