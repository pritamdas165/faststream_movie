<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastStream | Premium Home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #e50914; --bg: #121212; --card-bg: #1e1e1e; --nav-bg: rgba(20, 20, 20, 0.95); --sidebar-bg: #1a1a1a; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: radial-gradient(circle at top, #1c1c1c 0%, #121212 100%); color: white; margin: 0; overflow-x: hidden; }
        header { padding: 15px 5%; background: var(--nav-bg); display: flex; align-items: center; position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(15px); border-bottom: 1px solid #252525; gap: 15px; }
        .menu-btn { font-size: 22px; cursor: pointer; color: white; }
        .logo { font-size: 22px; font-weight: 900; color: var(--primary); text-decoration: none; flex-grow: 1; letter-spacing: 1px; }
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: var(--sidebar-bg); z-index: 2000; transition: 0.4s; overflow-y: auto; }
        .sidebar.active { left: 0; }
        .sidebar-header { padding: 20px; background: #111; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; }
        .sidebar-menu li a { display: flex; align-items: center; padding: 15px 20px; color: #ccc; text-decoration: none; border-bottom: 1px solid #252525; }
        .sidebar-menu i { width: 30px; color: var(--primary); }
        .submenu { display: none; background: #151515; list-style: none; padding: 0; }
        .submenu li a { padding-left: 50px !important; font-size: 14px !important; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1500; display: none; }
        .overlay.active { display: block; }
        .swiper { width: 100%; height: 260px; margin-bottom: 10px; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; }
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px 5% 50px; }
        .movie-card { background: var(--card-bg); border-radius: 6px; overflow: hidden; border: 1px solid #282828; cursor: pointer; position: relative; }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-info { padding: 5px; font-size: 11px; text-align: center; color: #ccc; }
        @media (min-width: 768px) { .swiper { height: 450px; } .movie-grid { grid-template-columns: repeat(6, 1fr); } }
    </style>
</head>
<body>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header"><span style="font-weight:900; color:var(--primary);">FASTSTREAM</span><i class="fas fa-times" onclick="toggleMenu()"></i></div>
        <ul class="sidebar-menu">
            <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="#" onclick="filterMenu('Bollywood')"><i class="fas fa-film"></i> Bollywood</a></li>
            <li><a href="#" onclick="filterMenu('Hollywood')"><i class="fas fa-globe"></i> Hollywood</a></li>
            <li class="dropdown"><a href="javascript:void(0)" onclick="toggleDropdown()"><i class="fas fa-list"></i> GENRES <i class="fas fa-chevron-down" style="margin-left:auto;"></i></a>
                <ul class="submenu" id="genreSubmenu">
                    <li><a href="#" onclick="filterMenu('Action')">Action</a></li>
                    <li><a href="#" onclick="filterMenu('Horror')">Horror</a></li>
                </ul>
            </li>
        </ul>
    </div>
    <header><i class="fas fa-bars menu-btn" onclick="toggleMenu()"></i><a href="index.html" class="logo">FASTSTREAM</a></header>
    <div class="swiper mySwiper"><div class="swiper-wrapper" id="sliderWrapper"></div></div>
    <div class="movie-grid" id="movieGrid"></div>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4", authDomain: "movie-project-b78b4.firebaseapp.com", databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com", projectId: "movie-project-b78b4", storageBucket: "movie-project-b78b4.firebasestorage.app", messagingSenderId: "819696212001", appId: "1:819696212001:web:379b19305c6d604b2deb60" };
        firebase.initializeApp(firebaseConfig); const db = firebase.database();
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }
        function toggleDropdown() { const sm = document.getElementById('genreSubmenu'); sm.style.display = sm.style.display === "block" ? "none" : "block"; }
        db.ref('movies').on('value', (snap) => {
            const grid = document.getElementById('movieGrid'); const slider = document.getElementById('sliderWrapper');
            grid.innerHTML = ''; slider.innerHTML = '';
            snap.forEach((child) => {
                const m = child.val(); const id = child.key;
                slider.innerHTML += `<div class="swiper-slide" onclick="location.href='go.html?id=${id}'"><img src="${m.poster}"></div>`;
                grid.innerHTML += `<div class="movie-card" data-genre="${m.genre}" onclick="location.href='go.html?id=${id}'"><img src="${m.poster}"><div class="card-info">${m.title}</div></div>`;
            });
            new Swiper(".mySwiper", { loop: true, autoplay: { delay: 3000 } });
        });
        function filterMenu(g) { toggleMenu(); document.querySelectorAll('.movie-card').forEach(c => { c.style.display = c.getAttribute('data-genre').toLowerCase().includes(g.toLowerCase()) ? "block" : "none"; }); }
    </script>
</body>
</html>
