<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastStream | Premium Home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #e50914; --bg: #000; --card-bg: #141414; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: white; margin: 0; }

        /* Navbar */
        header { 
            padding: 15px 4%; background: rgba(0,0,0,0.9); 
            display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }
        .logo { font-size: 24px; font-weight: 800; color: var(--primary); text-decoration: none; }

        /* Hero Swiper Slider */
        .swiper { width: 100%; height: 260px; margin-bottom: 20px; }
        .swiper-slide { position: relative; cursor: pointer; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        .slide-overlay { 
            position: absolute; bottom: 0; width: 100%; height: 60%; 
            background: linear-gradient(transparent, var(--bg)); 
        }
        .slide-title { position: absolute; bottom: 20px; left: 4%; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 10px #000; }

        /* Search Bar */
        .search-area { padding: 0 4% 20px; }
        #searchInput { 
            width: 100%; padding: 12px 20px; border-radius: 5px; border: 1px solid #333; 
            background: #1a1a1a; color: white; outline: none; box-sizing: border-box;
        }

        /* Movie Grid */
        .movie-grid { 
            display: grid; grid-template-columns: repeat(2, 1fr); 
            gap: 12px; padding: 0 4% 40px; 
        }
        .movie-card { background: var(--card-bg); border-radius: 8px; overflow: hidden; position: relative; border: 1px solid #222; }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-badge { position: absolute; top: 8px; left: 8px; background: var(--primary); font-size: 10px; padding: 3px 7px; border-radius: 3px; font-weight: bold; }
        .card-title { padding: 10px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        @media (min-width: 768px) {
            .swiper { height: 450px; }
            .movie-grid { grid-template-columns: repeat(5, 1fr); }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">FASTSTREAM</a>
        <a href="request.html" style="color:white; text-decoration:none;"><i class="fas fa-plus"></i> Request</a>
    </header>

    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="sliderWrapper">
            </div>
        <div class="swiper-pagination"></div>
    </div>

    <div class="search-area">
        <input type="text" id="searchInput" placeholder="Search movies..." onkeyup="searchMovie()">
    </div>

    <div class="movie-grid" id="movieGrid"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
            authDomain: "movie-project-b78b4.firebaseapp.com",
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
            projectId: "movie-project-b78b4",
            storageBucket: "movie-project-b78b4.firebasestorage.app",
            messagingSenderId: "819696212001",
            appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('movies').on('value', (snap) => {
            const grid = document.getElementById('movieGrid');
            const slider = document.getElementById('sliderWrapper');
            grid.innerHTML = ''; slider.innerHTML = '';
            let count = 0;

            snap.forEach((child) => {
                const m = child.val();
                const id = child.key;

                // Slider (Latest 5)
                if(count < 5) {
                    slider.innerHTML += `
                    <div class="swiper-slide" onclick="location.href='go.html?id=${id}'">
                        <img src="${m.poster}">
                        <div class="slide-overlay"></div>
                        <div class="slide-title">${m.title}</div>
                    </div>`;
                    count++;
                }

                // Grid Items
                grid.innerHTML += `
                <div class="movie-card" onclick="location.href='go.html?id=${id}'">
                    <span class="card-badge">${m.quality || 'HD'}</span>
                    <img src="${m.poster}">
                    <div class="card-title">${m.title}</div>
                </div>`;
            });

            // Initialize Swiper after data loads
            new Swiper(".mySwiper", {
                loop: true,
                autoplay: { delay: 3000, disableOnInteraction: false },
                pagination: { el: ".swiper-pagination", clickable: true },
            });
        });

        function searchMovie() {
            let val = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.movie-card').forEach(c => {
                c.style.display = c.innerText.toLowerCase().includes(val) ? "block" : "none";
            });
        }
    </script>
</body>
</html>
