<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fast8Movie - Final</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root { --primary-bg: #0a0a0a; --secondary-bg: #151515; --accent: #e50914; --text-main: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--primary-bg); color: var(--text-main); padding-bottom: 70px; }
        header { position: sticky; top: 0; background: rgba(10,10,10,0.9); padding: 15px; z-index: 1000; backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222; }
        .logo { color: var(--accent); font-size: 1.4rem; font-weight: 900; text-decoration: none; }
        .carousel-section { height: 320px; perspective: 1500px; display: flex; justify-content: center; align-items: center; overflow: hidden; background: radial-gradient(circle, #222 0%, #0a0a0a 100%); }
        .carousel-container { position: relative; width: 160px; height: 230px; transform-style: preserve-3d; transition: transform 0.8s; }
        .carousel-item { position: absolute; width: 100%; height: 100%; border-radius: 12px; overflow: hidden; border: 1px solid #333; cursor: pointer; }
        .carousel-item img { width: 100%; height: 100%; object-fit: cover; }
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; }
        .movie-card { background: #1a1a1a; border-radius: 8px; overflow: hidden; cursor: pointer; border: 1px solid #222; }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-info { padding: 8px; font-size: 11px; text-align: center; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: #111; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; }
        .nav-item { color: #888; text-align: center; font-size: 11px; cursor: pointer; text-decoration: none; }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>
    <header><a href="index.html" class="logo">FAST8MOVIE</a><i class="fas fa-search"></i></header>
    <div class="carousel-section"><div class="carousel-container" id="carousel"></div></div>
    <main class="movie-grid" id="movie-display"></main>
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active"><i class="fas fa-home"></i><br>Home</a>
        <a href="admin.html" class="nav-item"><i class="fas fa-user-shield"></i><br>Admin</a>
    </nav>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4", authDomain: "movie-project-b78b4.firebaseapp.com", databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com", projectId: "movie-project-b78b4", storageBucket: "movie-project-b78b4.firebasestorage.app", messagingSenderId: "819696212001", appId: "1:819696212001:web:379b19305c6d604b2deb60" };
        firebase.initializeApp(firebaseConfig); const db = firebase.database();
        db.ref('movies').on('value', (snap) => {
            const data = snap.val(); const movies = data ? Object.keys(data).map(k => ({id:k, ...data[k]})) : [];
            document.getElementById('movie-display').innerHTML = movies.reverse().map(m => `<div class="movie-card" onclick="location.href='go.html?id=${m.id}'"><img src="${m.poster}"><div class="card-info">${m.title}</div></div>`).join('');
            document.getElementById('carousel').innerHTML = movies.slice(0, 5).map((m, i) => `<div class="carousel-item" style="transform: rotateY(${i * 72}deg) translateZ(280px);" onclick="location.href='go.html?id=${m.id}'"><img src="${m.poster}"></div>`).join('');
        });
        let angle = 0; setInterval(() => { angle -= 72; document.getElementById('carousel').style.transform = `rotateY(${angle}deg)`; }, 4000);
    </script>
</body>
</html>
