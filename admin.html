<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast8 Admin - Upload</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #e50914; --bg: #0a0a0a; --card: #151515; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; padding: 20px; }
        .form-card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #222; max-width: 500px; margin: auto; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; background: var(--primary); border: none; color: white; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn:disabled { background: #555; }
        #status { margin-top: 10px; text-align: center; color: var(--primary); font-size: 14px; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>Add Movie</h2>
        <label>Poster (Gallery)</label>
        <input type="file" id="poster" accept="image/*">
        
        <input type="text" id="title" placeholder="Movie Title">
        
        <select id="genre">
            <option value="Bollywood">Bollywood</option>
            <option value="Hollywood">Hollywood</option>
        </select>

        <input type="text" id="download" placeholder="Direct Download Link">
        
        <div id="status"></div>
        <button class="btn" id="uploadBtn" onclick="uploadMovie()">PUBLISH NOW</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        firebase.initializeApp({ apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4", databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com" });
        const db = firebase.database();

        async function uploadImage(file) {
            const formData = new FormData();
            formData.append("image", file);
            const res = await fetch("https://api.imgur.com/3/image", {
                method: "POST",
                headers: { Authorization: "Client-ID 546c36551c0986c" },
                body: formData
            });
            const data = await res.json();
            return data.data.link;
        }

        async function uploadMovie() {
            const btn = document.getElementById('uploadBtn');
            const status = document.getElementById('status');
            const file = document.getElementById('poster').files[0];
            const title = document.getElementById('title').value;
            const link = document.getElementById('download').value;

            if(!file || !title || !link) return alert("Fill all fields!");

            btn.disabled = true;
            status.innerText = "Uploading to Gallery...";
            
            try {
                const imgUrl = await uploadImage(file);
                await db.ref('movies').push({
                    title: title,
                    poster: imgUrl,
                    genre: document.getElementById('genre').value,
                    download: link,
                    timestamp: Date.now()
                });
                alert("Success!");
                location.reload();
            } catch (e) {
                alert("Error!");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
