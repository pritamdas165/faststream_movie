<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | FastStream</title>
    <style>
        :root { --primary: #e50914; --bg: #0f1014; --box: #1c1d24; }
        body { font-family: sans-serif; background: var(--bg); color: white; padding: 20px; }
        .box { background: var(--box); padding: 20px; border-radius: 12px; max-width: 500px; margin: auto; border: 1px solid #333; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #2a2b33; border: 1px solid #444; border-radius: 8px; color: white; box-sizing: border-box; }
        .btn { background: var(--primary); color: white; width: 100%; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-search { background: #28a745; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="color:#28a745">⚡ Quick Auto-Fetch</h2>
        <input type="text" id="searchName" placeholder="Movie Name (e.g. Kick)">
        <button class="btn btn-search" onclick="fetchMovie()">SEARCH & FILL DATA</button>
        <hr>
        <input type="text" id="t" placeholder="Title">
        <input type="text" id="p" placeholder="Poster URL">
        <input type="text" id="l" placeholder="Download Link">
        <textarea id="s" placeholder="Storyline..."></textarea>
        <input type="text" id="ss" placeholder="Screenshots (url1, url2)">
        <input type="text" id="yt" placeholder="Trailer ID">
        <button class="btn" onclick="saveMovie()">PUBLISH NOW</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
            authDomain: "movie-project-b78b4.firebaseapp.com",
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
            projectId: "movie-project-b78b4",
            storageBucket: "movie-project-b78b4.firebasestorage.app",
            messagingSenderId: "819696212001",
            appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        async function fetchMovie() {
            const name = document.getElementById('searchName').value;
            const apiKey = "cc9374659de08b939499a50af4715216";
            if(!name) return alert("Enter Name!");

            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${apiKey}&query=${encodeURIComponent(name)}`);
                const data = await res.json();
                if(data.results.length > 0) {
                    const m = data.results[0];
                    document.getElementById('t').value = m.title;
                    document.getElementById('p').value = "https://image.tmdb.org/t/p/w500" + m.poster_path;
                    document.getElementById('s').value = m.overview;
                    alert("✅ Success!");
                } else { alert("❌ Not Found!"); }
            } catch(e) { alert("Error!"); }
        }

        function saveMovie() {
            const data = {
                title: document.getElementById('t').value,
                poster: document.getElementById('p').value,
                link: document.getElementById('l').value,
                story: document.getElementById('s').value,
                screenshots: document.getElementById('ss').value,
                trailer: document.getElementById('yt').value
            };
            db.ref('movies').push(data).then(() => alert("Published!"));
        }
    </script>
</body>
</html>
