<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamAdmin | Professional Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #e50914; --bg: #0f1014; --card: #1c1d24; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; }
        
        /* Sidebar Styles */
        .sidebar { width: 250px; background: #000; height: 100vh; padding: 20px; position: fixed; border-right: 1px solid #333; }
        .sidebar h2 { color: var(--primary); font-size: 24px; margin-bottom: 30px; }
        .sidebar nav a { display: block; color: #888; padding: 12px 0; text-decoration: none; font-size: 16px; transition: 0.3s; }
        .sidebar nav a:hover, .sidebar nav a.active { color: white; }
        .sidebar nav a i { margin-right: 10px; }

        /* Main Content */
        .main-content { margin-left: 250px; padding: 40px; width: 100%; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* Form Card */
        .upload-card { background: var(--card); padding: 30px; border-radius: 15px; border: 1px solid #333; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; color: #aaa; margin-bottom: 8px; font-size: 14px; }
        input { width: 100%; padding: 12px; background: #2a2b33; border: 1px solid #444; border-radius: 8px; color: white; box-sizing: border-box; }
        
        /* Preview Section */
        .preview-box { background: #2a2b33; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; height: 250px; border: 2px dashed #444; }
        #posterPreview { max-height: 100%; width: auto; display: none; }

        .btn-upload { grid-column: span 2; background: var(--primary); color: white; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        .btn-upload:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(229, 9, 20, 0.4); }

        /* Movie List Table */
        .movie-list { margin-top: 40px; background: var(--card); border-radius: 15px; padding: 20px; border: 1px solid #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; color: #888; padding: 10px; border-bottom: 1px solid #333; }
        td { padding: 15px 10px; border-bottom: 1px solid #222; }
        .thumb { width: 40px; height: 50px; border-radius: 4px; object-fit: cover; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>FastStream</h2>
        <nav>
            <a href="#" class="active"><i class="fas fa-plus-circle"></i> Add Movie</a>
            <a href="index.html" target="_blank"><i class="fas fa-external-link-alt"></i> View Site</a>
            <a href="#"><i class="fas fa-chart-line"></i> Statistics</a>
            <a href="#"><i class="fas fa-cog"></i> Settings</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Upload New Content</h1>
            <p id="statusMsg" style="color: #aaa;">Ready to upload</p>
        </div>

        <div class="upload-card">
            <div class="form-inputs">
                <div class="input-group">
                    <label>Movie Title</label>
                    <input type="text" id="movieTitle" placeholder="e.g. Inception (2010)">
                </div>
                <div class="input-group">
                    <label>Poster Image URL</label>
                    <input type="text" id="moviePoster" oninput="updatePreview()" placeholder="https://link-to-image.jpg">
                </div>
                <div class="input-group">
                    <label>Direct Link / Download URL</label>
                    <input type="text" id="movieLink" placeholder="Paste your Monetag/Movie link">
                </div>
            </div>
            
            <div class="preview-side">
                <label>Poster Preview</label>
                <div class="preview-box">
                    <i id="previewPlaceholder" class="fas fa-image" style="font-size: 40px; color: #444;"></i>
                    <img id="posterPreview" src="" alt="Preview">
                </div>
            </div>

            <button class="btn-upload" onclick="uploadMovie()">
                <i class="fas fa-cloud-upload-alt"></i> PUBLISH MOVIE
            </button>
        </div>

        <div class="movie-list">
            <h3>Recent Uploads</h3>
            <table>
                <thead>
                    <tr>
                        <th>Poster</th>
                        <th>Title</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="movieTableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // Use the same Firebase Config as before
        const firebaseConfig = {
  apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
  authDomain: "movie-project-b78b4.firebaseapp.com",
  databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
  projectId: "movie-project-b78b4",
  storageBucket: "movie-project-b78b4.firebasestorage.app",
  messagingSenderId: "819696212001",
  appId: "1:819696212001:web:379b19305c6d604b2deb60"
}; 
  firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function updatePreview() {
            const url = document.getElementById('moviePoster').value;
            const img = document.getElementById('posterPreview');
            const icon = document.getElementById('previewPlaceholder');
            if (url) {
                img.src = url;
                img.style.display = 'block';
                icon.style.display = 'none';
            }
        }

        function uploadMovie() {
            const title = document.getElementById('movieTitle').value;
            const poster = document.getElementById('moviePoster').value;
            const link = document.getElementById('movieLink').value;
            const status = document.getElementById('statusMsg');

            if (title && poster && link) {
                database.ref('movies').push({ title, poster, link, timestamp: Date.now() })
                .then(() => {
                    status.innerText = "✅ Published Successfully!";
                    status.style.color = "#4CAF50";
                    // Clear inputs
                    document.getElementById('movieTitle').value = '';
                    document.getElementById('moviePoster').value = '';
                    document.getElementById('movieLink').value = '';
                });
            }
        }
    </script>
</body>
</html>
