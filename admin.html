<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast8 Admin | Gallery Upload</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #e50914; --bg: #0a0a0a; --card-bg: #151515; --border: #252525; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding-bottom: 80px; }
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .form-card { background: var(--card-bg); padding: 20px; border-radius: 15px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        label { font-size: 12px; color: #888; font-weight: bold; display: block; margin-top: 15px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #222; border: 1px solid var(--border); color: white; border-radius: 10px; box-sizing: border-box; outline: none; }
        input[type="file"] { border: 1px dashed var(--primary); background: #111; padding: 10px; cursor: pointer; }
        .publish-btn { width: 100%; padding: 16px; background: var(--primary); border: none; color: white; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 1rem; }
        .publish-btn:disabled { background: #555; cursor: not-allowed; }
        #status { font-size: 14px; text-align: center; margin-top: 15px; color: var(--primary); font-weight: bold; }
        
        /* Stats Page */
        .movie-item { background: #1a1a1a; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
        .hidden { display: none; }
        
        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--border); }
        .nav-item { text-align: center; color: #777; font-size: 12px; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

    <div class="container" id="addPage">
        <h2><i class="fas fa-plus-circle"></i> Add New Movie</h2>
        <div class="form-card">
            <label>Movie Poster (Gallery)</label>
            <input type="file" id="posterFile" accept="image/*">

            <label>Movie Title</label>
            <input type="text" id="title" placeholder="Enter title">

            <label>Category (Genre)</label>
            <select id="genre">
                <option value="Bollywood">Bollywood</option>
                <option value="Hollywood">Hollywood</option>
                <option value="Web Series">Web Series</option>
                <option value="18+">18+ Content</option>
            </select>

            <label>Quality (e.g. 720p, 1080p)</label>
            <input type="text" id="quality" placeholder="1080p Bluray">

            <label>Screenshot (Gallery)</label>
            <input type="file" id="ssFile" accept="image/*">

            <label>Direct Download Link</label>
            <input type="text" id="download" placeholder="Paste G-Drive or Direct Link">

            <div id="status"></div>
            <button class="publish-btn" id="uploadBtn" onclick="handleUpload()">PUBLISH TO SITE</button>
        </div>
    </div>

    <div class="container hidden" id="statsPage">
        <h2><i class="fas fa-database"></i> Managed Movies</h2>
        <div id="movieList"></div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="showTab('add', this)"><i class="fas fa-plus-square"></i><br>Add</div>
        <div class="nav-item" onclick="showTab('stats', this)"><i class="fas fa-list"></i><br>Movies</div>
        <a href="index.html" class="nav-item" style="text-decoration:none;"><i class="fas fa-eye"></i><br>View Site</a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
            authDomain: "movie-project-b78b4.firebaseapp.com",
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
            projectId: "movie-project-b78b4",
            storageBucket: "movie-project-b78b4.firebasestorage.app",
            messagingSenderId: "819696212001",
            appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 🚀 Imgur Upload Function
        async function uploadImage(file) {
            if (!file) return "";
            const formData = new FormData();
            formData.append("image", file);
            const response = await fetch("https://api.imgur.com/3/image", {
                method: "POST",
                headers: { Authorization: "Client-ID 546c36551c0986c" },
                body: formData
            });
            const resData = await response.json();
            return resData.data.link;
        }

        async function handleUpload() {
            const btn = document.getElementById('uploadBtn');
            const status = document.getElementById('status');
            const poster = document.getElementById('posterFile').files[0];
            const ss = document.getElementById('ssFile').files[0];
            const title = document.getElementById('title').value;

            if(!poster || !title) return alert("Poster and Title are required!");

            btn.disabled = true;
            status.innerText = "Uploading images... Please wait.";

            try {
                const posterUrl = await uploadImage(poster);
                const ssUrl = await uploadImage(ss);

                const movieData = {
                    title: title,
                    poster: posterUrl,
                    genre: document.getElementById('genre').value,
                    quality: document.getElementById('quality').value,
                    download: document.getElementById('download').value,
                    screenshots: [ssUrl],
                    timestamp: Date.now()
                };

                await db.ref('movies').push(movieData);
                status.innerText = "Success! Published.";
                alert("Movie Added Successfully!");
                location.reload();
            } catch (e) {
                console.error(e);
                alert("Upload failed! Try again.");
                btn.disabled = false;
            }
        }

        // Tab Switcher & Stats
        function showTab(tab, el) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('addPage').classList.toggle('hidden', tab === 'stats');
            document.getElementById('statsPage').classList.toggle('hidden', tab === 'add');
            if(tab === 'stats') loadMovies();
        }

        function loadMovies() {
            db.ref('movies').on('value', snap => {
                const list = document.getElementById('movieList');
                list.innerHTML = "";
                snap.forEach(child => {
                    list.innerHTML += `
                        <div class="movie-item">
                            <span>${child.val().title}</span>
                            <button onclick="deleteMovie('${child.key}')" style="background:none; border:none; color:red; cursor:pointer;"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                });
            });
        }

        function deleteMovie(id) {
            if(confirm("Delete this movie?")) db.ref('movies/' + id).remove();
        }
    </script>
</body>
</html>
