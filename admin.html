<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastStream Admin Fix</title>
    <style>
        :root { --primary: #e50914; --bg: #0f1014; --box: #1c1d24; }
        body { font-family: sans-serif; background: var(--bg); color: white; padding: 20px; }
        .box { background: var(--box); padding: 20px; border-radius: 12px; max-width: 480px; margin: auto; border: 1px solid #333; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #2a2b33; border: 1px solid #444; border-radius: 8px; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-search { background: #28a745; color: white; margin-bottom: 15px; }
        .btn-save { background: var(--primary); color: white; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="box">
        <h2 style="color:#28a745">⚡ Quick Search</h2>
        <input type="text" id="movieSearchInput" placeholder="Enter Movie Name (e.g. Kick)">
        <button class="btn btn-search" onclick="fetchTMDBData()">SEARCH & FILL DATA</button>
        <hr style="border:0.5px solid #444; margin: 20px 0;">
        <input type="text" id="title" placeholder="Movie Title">
        <input type="text" id="poster" placeholder="Poster Link">
        <input type="text" id="link" placeholder="Download Link">
        <textarea id="story" rows="4" placeholder="Storyline..."></textarea>
        <input type="text" id="yt" placeholder="Trailer ID">
        <button class="btn btn-save" onclick="saveToFirebase()">PUBLISH MOVIE</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
            authDomain: "movie-project-b78b4.firebaseapp.com",
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
            projectId: "movie-project-b78b4",
            storageBucket: "movie-project-b78b4.firebasestorage.app",
            messagingSenderId: "819696212001",
            appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        async function fetchTMDBData() {
            const name = document.getElementById('movieSearchInput').value;
            const apiKey = "cc9374659de08b939499a50af4715216"; // Fixed API Key
            
            if(!name) { alert("Please enter a movie name!"); return; }

            try {
                // Movie Search call
                const searchRes = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${apiKey}&query=${encodeURIComponent(name)}`);
                const searchData = await searchRes.json();
                
                if(searchData.results && searchData.results.length > 0) {
                    const movie = searchData.results[0];
                    
                    // Detail fetch for Trailer & Full Story
                    const detailRes = await fetch(`https://api.themoviedb.org/3/movie/${movie.id}?api_key=${apiKey}&append_to_response=videos`);
                    const details = await detailRes.json();

                    document.getElementById('title').value = details.title + " (" + details.release_date.split('-')[0] + ")";
                    document.getElementById('poster').value = "https://image.tmdb.org/t/p/w500" + details.poster_path;
                    document.getElementById('story').value = details.overview;

                    const trailer = details.videos.results.find(v => v.type === 'Trailer' && v.site === 'YouTube');
                    if(trailer) document.getElementById('yt').value = trailer.key;

                    alert("✅ Success: Movie Data Fetched!");
                } else {
                    alert("❌ No Movie Found!");
                }
            } catch (error) {
                console.error(error);
                alert("⚠️ Error fetching data. Check your internet!");
            }
        }

        function saveToFirebase() {
            const data = {
                title: document.getElementById('title').value,
                poster: document.getElementById('poster').value,
                link: document.getElementById('link').value,
                story: document.getElementById('story').value,
                trailer: document.getElementById('yt').value
            };
            if(data.title && data.poster) {
                db.ref('movies').push(data).then(() => {
                    alert("✅ Published Successfully!");
                    location.reload();
                });
            } else { alert("Fill the data first!"); }
        }
    </script>
</body>
</html>
