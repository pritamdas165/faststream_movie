<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastStream | Pro Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #e50914; --bg: #0f0f0f; --card-bg: #1a1a1a; --border: #2b2b2b; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; padding-bottom: 80px; }
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .form-card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        label { font-size: 12px; color: #888; font-weight: bold; display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #222; border: 1px solid var(--border); color: white; border-radius: 8px; box-sizing: border-box; }
        /* Style for File Input */
        input[type="file"] { background: #333; padding: 10px; border: 1px dashed var(--primary); }
        .publish-btn { width: 100%; padding: 15px; background: var(--primary); border: none; color: white; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .progress-bar { width: 0%; height: 5px; background: var(--primary); transition: 0.3s; margin-bottom: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h2><i class="fas fa-cloud-upload-alt"></i> Upload Content</h2>
        <div class="form-card">
            <div id="uploadProgress" class="progress-bar"></div>
            
            <label>Select Movie Poster (Gallery)</label>
            <input type="file" id="posterFile" accept="image/*">

            <label>Movie Title</label>
            <input type="text" id="title" placeholder="Enter movie name">

            <label>Genre</label>
            <select id="genre">
                <option value="Bollywood">Bollywood</option>
                <option value="Hollywood">Hollywood</option>
                <option value="Web Series">Web Series</option>
            </select>

            <label>Select Movie Screenshot (Gallery)</label>
            <input type="file" id="ssFile" accept="image/*">

            <label>Download Link (Drive/Direct)</label>
            <input type="text" id="download" placeholder="Paste download link">

            <button class="publish-btn" id="uploadBtn" onclick="handleUpload()">
                <i class="fas fa-rocket"></i> UPLOAD & PUBLISH
            </button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
            authDomain: "movie-project-b78b4.firebaseapp.com",
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
            projectId: "movie-project-b78b4",
            storageBucket: "movie-project-b78b4.firebasestorage.app",
            messagingSenderId: "819696212001",
            appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const storage = firebase.storage();

        // Helper to upload file to Firebase Storage
        async function uploadFile(file, path) {
            if(!file) return "";
            const ref = storage.ref().child(path + '/' + Date.now() + "_" + file.name);
            const uploadTask = await ref.put(file);
            return await uploadTask.ref.getDownloadURL();
        }

        async function handleUpload() {
            const btn = document.getElementById('uploadBtn');
            const posterFile = document.getElementById('posterFile').files[0];
            const ssFile = document.getElementById('ssFile').files[0];
            const title = document.getElementById('title').value;

            if(!posterFile || !title) return alert("Please select poster and enter title!");

            btn.disabled = true;
            btn.innerHTML = "Uploading... Please wait";
            document.getElementById('uploadProgress').style.width = "50%";

            try {
                // 1. Upload Poster
                const posterUrl = await uploadFile(posterFile, 'posters');
                
                // 2. Upload Screenshot
                const ssUrl = await uploadFile(ssFile, 'screenshots');

                // 3. Save to Database
                const movieData = {
                    title: title,
                    poster: posterUrl,
                    genre: document.getElementById('genre').value,
                    download: document.getElementById('download').value,
                    screenshots: [ssUrl],
                    timestamp: Date.now()
                };

                await db.ref('movies').push(movieData);
                document.getElementById('uploadProgress').style.width = "100%";
                alert("Movie Published Successfully from Gallery!");
                location.reload();

            } catch (error) {
                console.error(error);
                alert("Upload failed. Make sure Storage is enabled in Firebase Console.");
                btn.disabled = false;
                btn.innerHTML = "PUBLISH NOW";
            }
        }
    </script>
</body>
</html>
