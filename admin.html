<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | FastStream</title>
    <style>
        body { font-family: sans-serif; background: #0f1014; color: white; padding: 20px; text-align: center; }
        .box { background: #1c1d24; padding: 25px; border-radius: 12px; max-width: 500px; margin: auto; border: 1px solid #333; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; background: #2a2b33; border: 1px solid #444; border-radius: 8px; color: white; box-sizing: border-box; }
        .btn { background: #e50914; color: white; width: 100%; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .movie-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #333; text-align: left; }
    </style>
</head>
<body>
    <div id="loginBox" class="box">
        <h2>Admin Login</h2>
        <input type="password" id="pass" placeholder="Password">
        <button class="btn" onclick="login()">LOGIN</button>
    </div>

    <div id="panel" class="box" style="display:none;">
        <h2>🚀 Post Movie</h2>
        <input type="text" id="t" placeholder="Title">
        <input type="text" id="p" placeholder="Poster URL">
        <input type="text" id="l" placeholder="Monetag Link">
        <select id="g"><option value="Action">Action</option><option value="Drama">Drama</option><option value="South">South Indian</option></select>
        <button class="btn" onclick="add()">PUBLISH NOW</button>
        <hr>
        <h3>🎥 Manage Movies</h3>
        <div id="list"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
            authDomain: "movie-project-b78b4.firebaseapp.com",
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
            projectId: "movie-project-b78b4",
            storageBucket: "movie-project-b78b4.firebasestorage.app",
            messagingSenderId: "819696212001",
            appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function login() { if(document.getElementById('pass').value === "admin123") { document.getElementById('loginBox').style.display='none'; document.getElementById('panel').style.display='block'; loadList(); } }

        function add() {
            const t=document.getElementById('t').value, p=document.getElementById('p').value, l=document.getElementById('l').value, g=document.getElementById('g').value;
            if(t && p && l) { db.ref('movies').push({title: t + " " + g, poster: p, link: l}).then(() => { alert("Success!"); location.reload(); }); }
        }

        function loadList() {
            db.ref('movies').on('value', (snap) => {
                const div = document.getElementById('list'); div.innerHTML = '';
                snap.forEach(c => {
                    div.innerHTML += `<div class="movie-item"><span>${c.val().title}</span><button onclick="del('${c.key}')" style="background:red;color:white;border:none;padding:5px;border-radius:4px;">Del</button></div>`;
                });
            });
        }
        function del(key) { if(confirm("Delete?")) db.ref('movies').child(key).remove(); }
    </script>
</body>
</html>
