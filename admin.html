<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StreamAdmin | Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #e50914; --bg: #0f1014; --card: #1c1d24; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding-bottom: 70px; }
        .sidebar { width: 100%; background: #000; position: fixed; bottom: 0; border-top: 1px solid #333; z-index: 1000; }
        .sidebar nav { display: flex; justify-content: space-around; padding: 10px; }
        .sidebar nav a { color: #888; text-decoration: none; font-size: 12px; text-align: center; }
        .sidebar nav a i { display: block; font-size: 20px; margin-bottom: 3px; }
        .sidebar nav a.active { color: var(--primary); }
        .main-content { padding: 15px; box-sizing: border-box; }
        .upload-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #333; display: flex; flex-direction: column; gap: 12px; }
        label { display: block; color: #aaa; font-size: 13px; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; background: #2a2b33; border: 1px solid #444; border-radius: 8px; color: white; font-size: 15px; box-sizing: border-box; }
        .btn-upload { background: var(--primary); color: white; padding: 15px; border: none; border-radius: 8px; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px; cursor: pointer; }
        @media (min-width: 768px) { .main-content { max-width: 600px; margin: auto; padding-top: 50px; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <nav>
            <a href="#" class="active"><i class="fas fa-plus-circle"></i> Add</a>
            <a href="index.html" target="_blank"><i class="fas fa-external-link-alt"></i> Site</a>
        </nav>
    </div>
    <div class="main-content">
        <h2>🚀 Upload Movie</h2>
        <div class="upload-card">
            <input type="text" id="movieTitle" placeholder="Movie Title (e.g. Pushpa 2)">
            <input type="text" id="moviePoster" placeholder="Poster Image URL">
            <input type="text" id="movieLink" placeholder="Monetag Direct Link">
            <label>Select Quality</label>
            <select id="movieQuality">
                <option value="HD 720p">HD 720p</option>
                <option value="1080p FHD">1080p FHD</option>
                <option value="4K UHD">4K UHD</option>
                <option value="Dual Audio">Dual Audio</option>
            </select>
            <button class="btn-upload" onclick="uploadMovie()">PUBLISH NOW</button>
            <p id="statusMsg" style="text-align:center; color:#888;"></p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
            authDomain: "movie-project-b78b4.firebaseapp.com",
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
            projectId: "movie-project-b78b4",
            storageBucket: "movie-project-b78b4.firebasestorage.app",
            messagingSenderId: "819696212001",
            appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function uploadMovie() {
            const title = document.getElementById('movieTitle').value;
            const poster = document.getElementById('moviePoster').value;
            const link = document.getElementById('movieLink').value;
            const quality = document.getElementById('movieQuality').value;
            const status = document.getElementById('statusMsg');

            if (title && poster && link) {
                database.ref('movies').push({ title, poster, link, quality, timestamp: Date.now() })
                .then(() => {
                    status.innerText = "✅ Movie Added Successfully!";
                    document.getElementById('movieTitle').value = '';
                    document.getElementById('moviePoster').value = '';
                    document.getElementById('movieLink').value = '';
                });
            } else { status.innerText = "⚠️ Fill all fields!"; }
        }
    </script>
</body>
</html>
