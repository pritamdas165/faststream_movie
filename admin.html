<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Fast8Movie</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg: #0a0a0a; --card: #151515; --accent: #e50914; }
        body { background: var(--bg); color: #eee; font-family: sans-serif; padding: 15px; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 10px; border-radius: 10px; text-align: center; border: 1px solid #222; }
        .admin-box { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #222; }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 10px; background: #000; color: white; border: 1px solid #333; border-radius: 5px; box-sizing: border-box;}
        .btn { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .movie-list-item { display: flex; align-items: center; background: #111; padding: 10px; border-radius: 10px; margin-top: 10px; border: 1px solid #222; }
        .movie-list-item img { width: 40px; height: 55px; border-radius: 4px; margin-right: 15px; }
    </style>
</head>
<body>
    <div class="stat-grid">
        <div class="stat-card"><h3>Movies</h3><p id="m-count">0</p></div>
        <div class="stat-card"><h3>Requests</h3><p id="r-count">0</p></div>
        <div class="stat-card"><h3>Total DL</h3><p id="t-dl">0</p></div>
    </div>
    <div class="admin-box">
        <h2 id="ftitle">Add Movie</h2>
        <input type="hidden" id="eid">
        <input type="text" id="title" placeholder="Title">
        <input type="text" id="poster" placeholder="Poster Link">
        <select id="cat"><option value="Action">Action</option><option value="Horror">Horror</option><option value="Comedy">Comedy</option></select>
        <textarea id="screens" placeholder="Screenshots (Comma separated links)"></textarea>
        <textarea id="desc" placeholder="Storyline"></textarea>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
            <input type="text" id="l480" placeholder="480p">
            <input type="text" id="l720" placeholder="720p">
            <input type="text" id="l1080" placeholder="1080p">
            <input type="text" id="l4k" placeholder="4K">
        </div>
        <button class="btn" id="sbtn" onclick="save()">SAVE DATA</button>
    </div>
    <h3>Requests</h3><div id="req-list"></div>
    <h3>Manage Movies</h3><div id="m-list"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        firebase.initializeApp({ apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4", databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com" });
        const db = firebase.database();
        function save() {
            const id = document.getElementById('eid').value;
            const data = { title:document.getElementById('title').value, poster:document.getElementById('poster').value, category:document.getElementById('cat').value, screens:document.getElementById('screens').value, desc:document.getElementById('desc').value, l480:document.getElementById('l480').value, l720:document.getElementById('l720').value, l1080:document.getElementById('l1080').value, l4k:document.getElementById('l4k').value };
            if(id) db.ref('movies/'+id).update(data).then(()=>location.reload());
            else db.ref('movies').push(data).then(()=>location.reload());
        }
        db.ref('movies').on('value', snap => {
            let h = ""; let count = 0; let dl = 0;
            Object.keys(snap.val() || {}).reverse().forEach(k => {
                const m = snap.val()[k]; count++; dl += (m.downloads || 0);
                h += `<div class="movie-list-item"><img src="${m.poster}"><div><h4>${m.title}</h4></div><div style="margin-left:auto;"><i class="fas fa-edit" onclick="edit('${k}')"></i> <i class="fas fa-trash" onclick="db.ref('movies/${k}').remove()"></i></div></div>`;
            });
            document.getElementById('m-list').innerHTML = h; document.getElementById('m-count').innerText = count; document.getElementById('t-dl').innerText = dl;
        });
        db.ref('requests').on('value', snap => {
            let h = ""; let c = 0; Object.keys(snap.val() || {}).forEach(k => { c++; h += `<div style="padding:10px; border-bottom:1px solid #222;">${snap.val()[k].movie} <i class="fas fa-check" onclick="db.ref('requests/${k}').remove()"></i></div>`; });
            document.getElementById('req-list').innerHTML = h; document.getElementById('r-count').innerText = c;
        });
        function edit(id) {
            db.ref('movies/'+id).once('value', snap => {
                const m = snap.val(); document.getElementById('eid').value = id; document.getElementById('title').value = m.title; document.getElementById('poster').value = m.poster; document.getElementById('desc').value = m.desc;
                document.getElementById('ftitle').innerText = "Edit Movie"; document.getElementById('sbtn').innerText = "UPDATE"; window.scrollTo(0,0);
            });
        }
    </script>
</body>
</html>
