<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Fast8Movie</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg: #0a0a0a; --card: #151515; --accent: #e50914; }
        body { background: var(--bg); color: white; font-family: 'Poppins', sans-serif; padding: 20px; }
        .admin-box { max-width: 500px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid #222; }
        h2 { text-align: center; margin-bottom: 25px; color: var(--accent); }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #888; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #0a0a0a; color: white; outline: none; }
        input:focus, select:focus { border-color: var(--accent); }
        
        .add-btn { width: 100%; padding: 15px; background: var(--accent); border: none; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        
        /* Movie List Area */
        .movie-list { margin-top: 40px; }
        .movie-item { display: flex; align-items: center; background: #111; padding: 10px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #222; }
        .movie-item img { width: 50px; height: 70px; border-radius: 5px; object-fit: cover; margin-right: 15px; }
        .movie-item-info { flex-grow: 1; }
        .movie-item-info h4 { font-size: 14px; margin: 0; }
        .movie-item-info p { font-size: 11px; color: #666; margin: 3px 0 0; }
        .del-btn { color: #555; cursor: pointer; padding: 10px; transition: 0.3s; }
        .del-btn:hover { color: var(--accent); }
    </style>
</head>
<body>

    <div class="admin-box">
        <h2><i class="fas fa-user-shield"></i> Movie Manager</h2>
        
        <div class="input-group">
            <label>Movie Title</label>
            <input type="text" id="title" placeholder="Enter movie name">
        </div>
        
        <div class="input-group">
            <label>Poster URL</label>
            <input type="text" id="poster" placeholder="https://image-link.com/poster.jpg">
        </div>

        <div class="input-group">
            <label>Category</label>
            <select id="category">
                <option value="Action">Action</option>
                <option value="Horror">Horror</option>
                <option value="Comedy">Comedy</option>
                <option value="Drama">Drama</option>
                <option value="Sci-Fi">Sci-Fi</option>
            </select>
        </div>
        
        <div class="input-group">
            <label>Download URL</label>
            <input type="text" id="download" placeholder="Direct file link">
        </div>
        
        <button class="add-btn" onclick="addMovie()">ADD MOVIE TO DATABASE</button>

        <div class="movie-list" id="list">
            <h3 style="font-size: 16px; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px;">Recent Uploads</h3>
            </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4", 
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Movie Add korar Function
        function addMovie() {
            const title = document.getElementById('title').value;
            const poster = document.getElementById('poster').value;
            const category = document.getElementById('category').value;
            const download = document.getElementById('download').value;

            if(title && poster && download) {
                const newMovieRef = db.ref('movies').push();
                newMovieRef.set({
                    title: title,
                    poster: poster,
                    category: category,
                    download: download
                }).then(() => {
                    alert("Movie Added Successfully!");
                    location.reload();
                });
            } else {
                alert("Please fill all fields!");
            }
        }

        // Movie List Display & Delete Logic
        db.ref('movies').on('value', snap => {
            const data = snap.val();
            const listDiv = document.getElementById('list');
            let html = '<h3 style="font-size: 16px; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px;">Recent Uploads</h3>';
            
            if(data) {
                Object.keys(data).reverse().forEach(key => {
                    const m = data[key];
                    html += `
                    <div class="movie-item">
                        <img src="${m.poster}">
                        <div class="movie-item-info">
                            <h4>${m.title}</h4>
                            <p>${m.category}</p>
                        </div>
                        <i class="fas fa-trash del-btn" onclick="deleteMovie('${key}')"></i>
                    </div>`;
                });
            }
            listDiv.innerHTML = html;
        });

        function deleteMovie(id) {
            if(confirm("Are you sure you want to delete this movie?")) {
                db.ref('movies/' + id).remove();
            }
        }
    </script>
</body>
</html>
