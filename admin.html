<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel Fix</title>
    <style>
        body { font-family: sans-serif; background: #0f1014; color: white; padding: 20px; }
        .box { background: #1c1d24; padding: 20px; border-radius: 12px; max-width: 450px; margin: auto; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #2a2b33; border: 1px solid #444; border-radius: 8px; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .search-btn { background: #28a745; color: white; }
        .save-btn { background: #e50914; color: white; }
    </style>
</head>
<body>

<div class="box">
    <h3>⚡ Search Movie</h3>
    <input type="text" id="q" placeholder="Movie Name (e.g. Kick)">
    <button class="btn search-btn" onclick="fetchData()">SEARCH & FILL</button>
    <hr style="margin: 20px 0; border: 0.5px solid #333;">
    <input type="text" id="t" placeholder="Title">
    <input type="text" id="p" placeholder="Poster URL">
    <input type="text" id="l" placeholder="Download Link">
    <textarea id="s" placeholder="Storyline..." rows="3"></textarea>
    <input type="text" id="ss" placeholder="Screenshots (url1, url2)">
    <input type="text" id="yt" placeholder="Trailer ID">
    <button class="btn save-btn" onclick="saveData()">PUBLISH NOW</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
        authDomain: "movie-project-b78b4.firebaseapp.com",
        databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
        projectId: "movie-project-b78b4",
        storageBucket: "movie-project-b78b4.firebasestorage.app",
        messagingSenderId: "819696212001",
        appId: "1:819696212001:web:379b19305c6d604b2deb60"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    async function fetchData() {
        const query = document.getElementById('q').value;
        const key = "cc9374659de08b939499a50af4715216"; // Fixed Key
        
        if(!query) return alert("Enter Name!");

        try {
            const r = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${key}&query=${encodeURIComponent(query)}`);
            const d = await r.json();
            
            if(d.results && d.results.length > 0) {
                const m = d.results[0];
                document.getElementById('t').value = m.title;
                document.getElementById('p').value = "https://image.tmdb.org/t/p/w500" + m.poster_path;
                document.getElementById('s').value = m.overview;
                alert("✅ Movie Found!");
            } else {
                alert("❌ Not Found!");
            }
        } catch(e) { alert("API Connection Error!"); }
    }

    function saveData() {
        const data = {
            title: document.getElementById('t').value,
            poster: document.getElementById('p').value,
            link: document.getElementById('l').value,
            story: document.getElementById('s').value,
            screenshots: document.getElementById('ss').value,
            trailer: document.getElementById('yt').value
        };
        if(data.title) {
            db.ref('movies').push(data).then(() => {
                alert("✅ Success!");
                location.reload();
            });
        }
    }
</script>
</body>
</html>
