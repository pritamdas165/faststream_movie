<div id="panel" class="box" style="display:none; max-width: 600px; margin: auto; background: #1c1d24; padding: 20px; border-radius: 10px;">
    <h2>🎬 Post New Movie (Pro)</h2>
    
    <input type="text" id="t" placeholder="Movie Title (e.g. Arjun Reddy)">
    <input type="text" id="p" placeholder="Main Poster URL">
    <input type="text" id="l" placeholder="Download Link (Monetag)">
    
    <label>Movie Storyline</label>
    <textarea id="s" style="width:100%; height:80px; background:#2a2b33; color:white; border-radius:8px; padding:10px;" placeholder="Write storyline..."></textarea>
    
    <label>Screenshot URLs (Comma separated)</label>
    <input type="text" id="ss" placeholder="https://img1.jpg, https://img2.jpg">
    
    <label>YouTube Trailer ID (Only the ID after v=)</label>
    <input type="text" id="yt" placeholder="Example: d9MyW72ELq0">

    <select id="g">
        <option value="Action">Action</option>
        <option value="Drama">Drama</option>
        <option value="South">South Indian</option>
        <option value="Hindi">Hindi Dubbed</option>
    </select>

    <button class="btn" onclick="add()" style="background:#e50914; color:white; width:100%; padding:15px; border:none; margin-top:10px; cursor:pointer; font-weight:bold;">PUBLISH NOW</button>
</div>

<script>
    function add() {
        const t=document.getElementById('t').value, p=document.getElementById('p').value, l=document.getElementById('l').value,
              s=document.getElementById('s').value, ss=document.getElementById('ss').value, yt=document.getElementById('yt').value,
              g=document.getElementById('g').value;

        if(t && p && l) {
            db.ref('movies').push({
                title: t, poster: p, link: l,
                story: s, screenshots: ss, trailer: yt, genre: g
            }).then(() => { alert("Success!"); location.reload(); });
        }
    }
</script>
