<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastStream | Pro Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #e50914; --bg: #0f0f0f; --card-bg: #1a1a1a; --border: #2b2b2b; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; margin: 0; padding-bottom: 80px; }
        
        .container { padding: 20px; max-width: 600px; margin: 0 auto; }
        
        /* Preview Section */
        .preview-container {
            background: var(--card-bg); border: 2px dashed var(--border);
            border-radius: 15px; height: 250px; display: flex; align-items: center;
            justify-content: center; margin-bottom: 20px; overflow: hidden; position: relative;
        }
        .preview-container img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .preview-placeholder { text-align: center; color: #555; }
        .preview-placeholder i { font-size: 50px; display: block; margin-bottom: 10px; }

        /* Form Styling */
        .form-card { background: var(--card-bg); padding: 20px; border-radius: 15px; border: 1px solid var(--border); }
        label { font-size: 12px; color: #888; font-weight: 600; text-transform: uppercase; }
        input, select { 
            width: 100%; padding: 14px; margin: 8px 0 18px; background: #252525; 
            border: 1px solid var(--border); color: white; border-radius: 10px; outline: none; box-sizing: border-box;
        }
        
        .publish-btn { 
            width: 100%; padding: 16px; background: var(--primary); color: white; 
            border: none; border-radius: 12px; font-weight: 900; cursor: pointer; 
            font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #000;
            display: flex; justify-content: space-around; padding: 12px 0;
            border-top: 1px solid var(--border); z-index: 1000;
        }
        .nav-item { text-align: center; color: #777; text-decoration: none; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { display: block; font-size: 20px; margin-bottom: 4px; }
        .nav-item span { font-size: 11px; font-weight: 500; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container" id="add-section">
        <h2 style="margin-top:0;">Publish Content</h2>
        
        <div class="preview-container" id="previewBox">
            <div class="preview-placeholder" id="placeholder">
                <i class="fas fa-image"></i>
                <span>Poster Preview</span>
            </div>
            <img id="posterImg" src="">
        </div>

        <div class="form-card">
            <label>Poster URL</label>
            <input type="text" id="poster" placeholder="Paste image link..." oninput="updatePreview()">

            <label>Movie Title</label>
            <input type="text" id="title" placeholder="Enter movie name">

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label>Genre</label>
                    <select id="genre">
                        <option value="Action">Action</option>
                        <option value="Bollywood">Bollywood</option>
                        <option value="Hollywood">Hollywood</option>
                        <option value="South Indian">South</option>
                    </select>
                </div>
                <div>
                    <label>Quality</label>
                    <input type="text" id="quality" placeholder="1080p">
                </div>
            </div>

            <label>Screenshots (URLs)</label>
            <input type="text" id="ss1" placeholder="Screenshot 1">
            
            <label>Download Link</label>
            <input type="text" id="download" placeholder="Direct download link">

            <button class="publish-btn" onclick="addMovie()">
                <i class="fas fa-cloud-upload-alt"></i> PUBLISH NOW
            </button>
        </div>
    </div>

    <div class="container hidden" id="stats-section">
        <h2>Content Stats</h2>
        <div id="movieList"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="showTab('add', this)">
            <i class="fas fa-plus-circle"></i>
            <span>Add</span>
        </div>
        <a href="index.html" class="nav-item">
            <i class="fas fa-external-link-alt"></i>
            <span>Site</span>
        </a>
        <div class="nav-item" onclick="showTab('stats', this)">
            <i class="fas fa-chart-line"></i>
            <span>Stats</span>
        </div>
        <div class="nav-item">
            <i class="fas fa-cog"></i>
            <span>Set</span>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
            authDomain: "movie-project-b78b4.firebaseapp.com",
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
            projectId: "movie-project-b78b4",
            storageBucket: "movie-project-b78b4.firebasestorage.app",
            messagingSenderId: "819696212001",
            appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // - Live Preview Logic
        function updatePreview() {
            const url = document.getElementById('poster').value;
            const img = document.getElementById('posterImg');
            const placeholder = document.getElementById('placeholder');
            if(url) {
                img.src = url; img.style.display = "block";
                placeholder.style.display = "none";
            } else {
                img.style.display = "none"; placeholder.style.display = "block";
            }
        }

        function showTab(tab, el) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            if(tab === 'add') {
                document.getElementById('add-section').classList.remove('hidden');
                document.getElementById('stats-section').classList.add('hidden');
            } else {
                document.getElementById('add-section').classList.add('hidden');
                document.getElementById('stats-section').classList.remove('hidden');
            }
        }

        function addMovie() {
            const data = {
                title: document.getElementById('title').value,
                poster: document.getElementById('poster').value,
                genre: document.getElementById('genre').value,
                quality: document.getElementById('quality').value,
                download: document.getElementById('download').value,
                screenshots: [document.getElementById('ss1').value],
                timestamp: Date.now()
            };
            if(!data.title || !data.poster) return alert("Title & Poster required!");
            db.ref('movies').push(data).then(() => {
                alert("Published Successfully!");
                location.reload();
            });
        }
    </script>
</body>
</html>
