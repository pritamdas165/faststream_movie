<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Manual Upload</title>
    <style>
        :root { --primary: #e50914; --bg: #0f1014; --box: #1c1d24; }
        body { font-family: sans-serif; background: var(--bg); color: white; padding: 20px; }
        .box { background: var(--box); padding: 25px; border-radius: 12px; max-width: 480px; margin: auto; border: 1px solid #333; }
        h2 { text-align: center; color: var(--primary); }
        label { font-size: 14px; color: #aaa; margin-top: 10px; display: block; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #2a2b33; border: 1px solid #444; border-radius: 8px; color: white; box-sizing: border-box; }
        .btn { background: var(--primary); color: white; width: 100%; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 15px; }
        .btn:hover { background: #b20710; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Add New Movie</h2>
        
        <label>Movie Title</label>
        <input type="text" id="title" placeholder="e.g. Kick (2014)">
        
        <label>Poster Image URL</label>
        <input type="text" id="poster" placeholder="Paste Image Link">
        
        <label>Download Link</label>
        <input type="text" id="link" placeholder="Paste Download Link">
        
        <label>Storyline / Description</label>
        <textarea id="story" rows="4" placeholder="Brief story..."></textarea>
        
        <label>YouTube Trailer ID (Optional)</label>
        <input type="text" id="yt" placeholder="e.g. d83l0s_f4">

        <button class="btn" onclick="saveToFirebase()">PUBLISH MOVIE</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <script>
        // Apnar Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
            authDomain: "movie-project-b78b4.firebaseapp.com",
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
            projectId: "movie-project-b78b4",
            storageBucket: "movie-project-b78b4.firebasestorage.app",
            messagingSenderId: "819696212001",
            appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function saveToFirebase() {
            const title = document.getElementById('title').value;
            const poster = document.getElementById('poster').value;
            const link = document.getElementById('link').value;
            const story = document.getElementById('story').value;
            const trailer = document.getElementById('yt').value;

            // Form Validation
            if(!title || !poster || !link) {
                alert("Please fill Title, Poster, and Download Link!");
                return;
            }

            const movieData = {
                title: title,
                poster: poster,
                link: link,
                story: story,
                trailer: trailer,
                date: new Date().toLocaleDateString()
            };

            // Database Save
            db.ref('movies').push(movieData)
            .then(() => {
                alert("✅ Movie Published Successfully!");
                // Clear fields
                document.getElementById('title').value = "";
                document.getElementById('poster').value = "";
                document.getElementById('link').value = "";
                document.getElementById('story').value = "";
                document.getElementById('yt').value = "";
            })
            .catch((error) => {
                alert("❌ Error: " + error.message);
            });
        }
    </script>
</body>
</html>
