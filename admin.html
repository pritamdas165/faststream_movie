<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Pro - Fast8Movie</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg: #0a0a0a; --card: #151515; --accent: #e50914; }
        body { background: var(--bg); color: white; font-family: 'Poppins', sans-serif; padding: 20px; }
        .admin-box { max-width: 600px; margin: 0 auto; background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid #222; }
        h2 { text-align: center; color: var(--accent); margin-bottom: 20px; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #0a0a0a; color: white; outline: none; box-sizing: border-box; }
        textarea { height: 70px; resize: none; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .add-btn { width: 100%; padding: 15px; background: var(--accent); border: none; color: white; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .movie-item { display: flex; align-items: center; background: #111; padding: 10px; border-radius: 10px; margin-top: 10px; border: 1px solid #222; }
        .movie-item img { width: 50px; height: 70px; border-radius: 5px; margin-right: 15px; }
    </style>
</head>
<body>
    <div class="admin-box">
        <h2><i class="fas fa-user-shield"></i> Advanced Manager</h2>
        <div class="input-group"><label>Title</label><input type="text" id="title"></div>
        <div class="input-group"><label>Poster URL</label><input type="text" id="poster"></div>
        <div class="input-group"><label>Category</label>
            <select id="category">
                <option value="Action">Action</option><option value="Horror">Horror</option>
                <option value="Comedy">Comedy</option><option value="Drama">Drama</option>
            </select>
        </div>
        <div class="input-group"><label>Screenshots (Link1, Link2, Link3)</label><textarea id="screens"></textarea></div>
        <div class="input-group"><label>Storyline</label><textarea id="desc"></textarea></div>
        <div class="grid">
            <input type="text" id="l480" placeholder="480p Link">
            <input type="text" id="l720" placeholder="720p Link">
            <input type="text" id="l1080" placeholder="1080p Link">
            <input type="text" id="l4k" placeholder="4K Link">
        </div>
        <button class="add-btn" onclick="addMovie()">ADD MOVIE</button>
    </div>
    <div id="list" style="max-width:600px; margin: 30px auto;"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        firebase.initializeApp({ apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4", databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com" });
        const db = firebase.database();
        function addMovie() {
            const data = {
                title: document.getElementById('title').value,
                poster: document.getElementById('poster').value,
                category: document.getElementById('category').value,
                screens: document.getElementById('screens').value,
                desc: document.getElementById('desc').value,
                l480: document.getElementById('l480').value,
                l720: document.getElementById('l720').value,
                l1080: document.getElementById('l1080').value,
                l4k: document.getElementById('l4k').value
            };
            db.ref('movies').push(data).then(() => { alert("Success!"); location.reload(); });
        }
        db.ref('movies').on('value', snap => {
            let h = "";
            Object.keys(snap.val() || {}).reverse().forEach(k => {
                const m = snap.val()[k];
                h += `<div class="movie-item"><img src="${m.poster}"><div><h4>${m.title}</h4><p>${m.category}</p></div><i class="fas fa-trash" style="margin-left:auto; cursor:pointer;" onclick="db.ref('movies/${k}').remove()"></i></div>`;
            });
            document.getElementById('list').innerHTML = h;
        });
    </script>
</body>
</html>
