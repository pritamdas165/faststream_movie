<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Movie Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase v9 compat -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
body {
    background:#0f0f0f;
    color:#fff;
    font-family:Arial, sans-serif;
    margin:0;
    padding:20px;
}
.container {
    max-width:600px;
    margin:auto;
    background:#1a1a1a;
    padding:20px;
    border-radius:10px;
}
h2 { text-align:center; color:#e50914; }

input, textarea, button {
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:6px;
    border:none;
    outline:none;
}
input, textarea { background:#2a2a2a; color:#fff; }
button {
    background:#e50914;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}
button:hover { opacity:0.9; }

img {
    width:150px;
    margin-top:10px;
    border-radius:6px;
    display:none;
}
</style>
</head>

<body>

<div class="container">
<h2>Movie Admin Panel</h2>

<!-- TMDB SEARCH -->
<input id="movieSearchInput" placeholder="Search movie name">
<button onclick="fetchMovie()">Fetch from TMDB</button>

<hr style="margin:20px 0; border-color:#333;">

<!-- AUTO FILLED FIELDS -->
<input id="title" placeholder="Movie Title">
<input id="poster" placeholder="Poster URL">
<img id="posterPreview">

<textarea id="story" rows="4" placeholder="Storyline"></textarea>

<input id="download" placeholder="Download Link">
<input id="trailer" placeholder="YouTube Trailer ID">

<button onclick="publishMovie()">Publish</button>
</div>

<script>
/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
    apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
    authDomain: "movie-project-b78b4.firebaseapp.com",
    databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
    projectId: "movie-project-b78b4",
    storageBucket: "movie-project-b78b4.firebasestorage.app",
    messagingSenderId: "819696212001",
    appId: "1:819696212001:web:379b19305c6d604b2deb60"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ================= TMDB CONFIG ================= */
const TMDB_API_KEY = "cc9374659de08b939499a50af4715216";

/* ================= FETCH MOVIE ================= */
async function fetchMovie() {
    const query = document.getElementById("movieSearchInput").value.trim();
    if (!query) {
        alert("Enter movie name");
        return;
    }

    try {
        const res = await fetch(
            `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`
        );
        const data = await res.json();

        if (!data.results || data.results.length === 0) {
            alert("Movie not found");
            return;
        }

        const movie = data.results[0];

        document.getElementById("title").value = movie.title || "";
        document.getElementById("story").value = movie.overview || "";

        if (movie.poster_path) {
            const posterURL = "https://image.tmdb.org/t/p/w500" + movie.poster_path;
            document.getElementById("poster").value = posterURL;
            document.getElementById("posterPreview").src = posterURL;
            document.getElementById("posterPreview").style.display = "block";
        }

    } catch (err) {
        alert("TMDB Error");
        console.error(err);
    }
}

/* ================= PUBLISH MOVIE ================= */
function publishMovie() {
    const movieData = {
        title: document.getElementById("title").value,
        poster: document.getElementById("poster").value,
        description: document.getElementById("story").value,
        downloadUrl: document.getElementById("download").value,
        trailerId: document.getElementById("trailer").value,
        timestamp: Date.now()
    };

    if (!movieData.title || !movieData.poster) {
        alert("Title & Poster required");
        return;
    }

    db.ref("movies").push(movieData)
        .then(() => {
            alert("Movie Published Successfully!");
            document.querySelectorAll("input, textarea").forEach(e => e.value = "");
            document.getElementById("posterPreview").style.display = "none";
        })
        .catch(err => {
            alert("Firebase Error");
            console.error(err);
        });
}
</script>

</body>
</html>
