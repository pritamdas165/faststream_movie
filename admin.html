<div class="admin-box">
    <h2><i class="fas fa-user-shield"></i> Advanced Movie Manager</h2>
    
    <div class="input-group">
        <label>Movie Title</label>
        <input type="text" id="title" placeholder="Pushpa 2: The Rule (2024)">
    </div>
    
    <div class="input-group">
        <label>Poster URL</label>
        <input type="text" id="poster" placeholder="Main Poster Link">
    </div>

    <div class="input-group">
        <label>Movie Screenshots (Comma separated links)</label>
        <textarea id="screens" placeholder="link1.jpg, link2.jpg, link3.jpg"></textarea>
    </div>

    <div class="input-group">
        <label>Storyline / Description</label>
        <textarea id="desc" placeholder="Write movie plot here..."></textarea>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="input-group"><label>480p Link</label><input type="text" id="link480" placeholder="480p URL"></div>
        <div class="input-group"><label>720p Link</label><input type="text" id="link720" placeholder="720p URL"></div>
        <div class="input-group"><label>1080p Link</label><input type="text" id="link1080" placeholder="1080p URL"></div>
        <div class="input-group"><label>4K Link</label><input type="text" id="link4K" placeholder="4K URL"></div>
    </div>
    
    <button class="add-btn" onclick="addMovie()">SAVE MOVIE DATA</button>
</div>

<script>
    function addMovie() {
        const data = {
            title: document.getElementById('title').value,
            poster: document.getElementById('poster').value,
            screens: document.getElementById('screens').value, // screenshots
            desc: document.getElementById('desc').value,
            link480: document.getElementById('link480').value,
            link720: document.getElementById('link720').value,
            link1080: document.getElementById('link1080').value,
            link4K: document.getElementById('link4K').value,
            category: document.getElementById('category').value
        };

        if(data.title && data.poster) {
            db.ref('movies').push(data).then(() => {
                alert("Movie Added with Multiple Qualities!");
                location.reload();
            });
        }
    }
</script>
