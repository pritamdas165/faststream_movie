<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Admin Panel</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a0a0b; color: white; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #161618; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input, button { width: 90%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; }
        input { background: #222; color: white; border: 1px solid #333; }
        button { background: #e50914; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #ff0a16; }
        .status { margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎬 Add New Movie</h2>
        <input type="text" id="movieTitle" placeholder="Movie Title (e.g. Pushpa 2)">
        <input type="text" id="moviePoster" placeholder="Poster Image URL">
        <input type="text" id="movieLink" placeholder="Movie Download/Watch URL">
        <button onclick="uploadMovie()">Upload Movie</button>
        <div class="status" id="statusMsg">Admin Panel is Ready</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // FIXME: Ekhane apnar Firebase Config bishat hobe (Ami pore dekhiye dichhi)
        const firebaseConfig = {
  apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
  authDomain: "movie-project-b78b4.firebaseapp.com",
  databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
  projectId: "movie-project-b78b4",
  storageBucket: "movie-project-b78b4.firebasestorage.app",
  messagingSenderId: "819696212001",
  appId: "1:819696212001:web:379b19305c6d604b2deb60"
}; 
  firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function uploadMovie() {
            const title = document.getElementById('movieTitle').value;
            const poster = document.getElementById('moviePoster').value;
            const link = document.getElementById('movieLink').value;
            const status = document.getElementById('statusMsg');

            if (title && poster && link) {
                const movieData = {
                    title: title,
                    poster: poster,
                    link: link,
                    timestamp: Date.now()
                };
                
                database.ref('movies').push(movieData)
                    .then(() => {
                        status.innerText = "✅ Movie Uploaded Successfully!";
                        document.getElementById('movieTitle').value = '';
                        document.getElementById('moviePoster').value = '';
                        document.getElementById('movieLink').value = '';
                    })
                    .catch((error) => {
                        status.innerText = "❌ Error: " + error.message;
                    });
            } else {
                status.innerText = "⚠️ Please fill all fields!";
            }
        }
    </script>
</body>
</html>
