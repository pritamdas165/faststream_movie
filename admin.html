<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Fast8Movie</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { background: #141414; color: white; font-family: sans-serif; padding: 20px; }
        .form-container { background: #1f1f1f; padding: 20px; border-radius: 10px; max-width: 600px; margin: 0 auto; }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; background: #333; border: 1px solid #444; color: white; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #e50914; border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 5px; }
        .movie-item { background: #2a2a2a; padding: 10px; margin: 10px 0; display: flex; align-items: center; justify-content: space-between; border-radius: 5px; }
        .thumb { width: 50px; height: 70px; object-fit: cover; }
    </style>
</head>
<body>

    <div class="form-container" id="login-box">
        <h2>Admin Login</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="pass" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>

    <div id="dashboard" style="display:none;">
        <div class="form-container">
            <h2>Add New Movie</h2>
            <input type="text" id="title" placeholder="Movie Title">
            <select id="genre">
                <option value="Action">Action</option>
                <option value="Comedy">Comedy</option>
                <option value="Drama">Drama</option>
            </select>
            <input type="text" id="poster" placeholder="Poster URL">
            <input type="text" id="play" placeholder="Play URL">
            <input type="text" id="down" placeholder="Download Link">
            <textarea id="desc" placeholder="Description"></textarea>
            <button onclick="addMovie()">Add Movie</button>
        </div>

        <h2 style="text-align:center; margin-top:30px;">Manage Movies</h2>
        <div id="movie-list" style="max-width:600px; margin: 0 auto;"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
            authDomain: "movie-project-b78b4.firebaseapp.com",
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
            projectId: "movie-project-b78b4",
            storageBucket: "movie-project-b78b4.firebasestorage.app",
            messagingSenderId: "819696212001",
            appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            auth.signInWithEmailAndPassword(e, p).then(() => {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadMovies();
            }).catch(err => alert(err.message));
        }

        function addMovie() {
            const data = {
                title: document.getElementById('title').value,
                genre: document.getElementById('genre').value,
                poster: document.getElementById('poster').value,
                playUrl: document.getElementById('play').value,
                downloadUrl: document.getElementById('down').value,
                description: document.getElementById('desc').value,
                timestamp: Date.now()
            };
            db.ref('movies').push(data).then(() => {
                alert("Movie Added!");
                location.reload();
            });
        }

        function loadMovies() {
            db.ref('movies').on('value', snap => {
                const data = snap.val();
                const list = document.getElementById('movie-list');
                list.innerHTML = '';
                if(data) {
                    Object.keys(data).forEach(k => {
                        const m = data[k];
                        list.innerHTML += `
                            <div class="movie-item">
                                <img src="${m.poster}" class="thumb">
                                <span>${m.title}</span>
                                <button onclick="deleteMovie('${k}')" style="width:auto; padding:5px 10px;">Delete</button>
                            </div>
                        `;
                    });
                }
            });
        }

        function deleteMovie(id) {
            if(confirm("Delete this?")) db.ref('movies/'+id).remove();
        }
    </script>
</body>
</html>
