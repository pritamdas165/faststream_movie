<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        body { font-family: sans-serif; background: #0f1014; color: white; padding: 20px; }
        .box { background: #1c1d24; padding: 20px; border-radius: 12px; max-width: 450px; margin: auto; border: 1px solid #333; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #2a2b33; border: 1px solid #444; border-radius: 8px; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .search-btn { background: #28a745; color: white; }
        .save-btn { background: #e50914; color: white; }
    </style>
</head>
<body>

<div class="box">
    <h3>⚡ Quick Search</h3>
    <input type="text" id="query" placeholder="Enter Movie Name (e.g. Kick)">
    <button class="btn search-btn" onclick="fetchMovie()">SEARCH & FILL DATA</button>
    <hr style="margin: 20px 0; border: 0.5px solid #333;">
    <input type="text" id="t" placeholder="Movie Title">
    <input type="text" id="p" placeholder="Poster Link">
    <input type="text" id="l" placeholder="Download Link">
    <textarea id="s" placeholder="Storyline..." rows="3"></textarea>
    <input type="text" id="ss" placeholder="Screenshots (url1, url2)">
    <input type="text" id="yt" placeholder="Trailer ID">
    <button class="btn save-btn" onclick="saveMovie()">PUBLISH MOVIE</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    // Apnar Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
        authDomain: "movie-project-b78b4.firebaseapp.com",
        databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
        projectId: "movie-project-b78b4",
        storageBucket: "movie-project-b78b4.firebasestorage.app",
        messagingSenderId: "819696212001",
        appId: "1:819696212001:web:379b19305c6d604b2deb60"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // TMDB API Search Logic
    async function fetchMovie() {
        const name = document.getElementById('query').value;
        const apiKey = "cc9374659de08b939499a50af4715216"; // Apnar API Key
        
        if(!name) {
            alert("Please enter a name!");
            return;
        }

        try {
            const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${apiKey}&query=${encodeURIComponent(name)}`);
            const data = await res.json();
            
            if(data.results && data.results.length > 0) {
                const movie = data.results[0];
                document.getElementById('t').value = movie.title + " (" + movie.release_date.split('-')[0] + ")";
                document.getElementById('p').value = "https://image.tmdb.org/t/p/w500" + movie.poster_path;
                document.getElementById('s').value = movie.overview;
                alert("✅ Data Found!");
            } else {
                alert("❌ Movie Not Found!");
            }
        } catch(err) {
            alert("⚠️ API Error! Please try again.");
        }
    }

    // Save to Firebase Logic
    function saveMovie() {
        const data = {
            title: document.getElementById('t').value,
            poster: document.getElementById('p').value,
            link: document.getElementById('l').value,
            story: document.getElementById('s').value,
            screenshots: document.getElementById('ss').value,
            trailer: document.getElementById('yt').value
        };

        if(data.title && data.poster) {
            db.ref('movies').push(data).then(() => {
                alert("✅ Published Successfully!");
                location.reload();
            }).catch(e => alert("❌ Error saving: " + e.message));
        } else {
            alert("Fill Title and Poster first!");
        }
    }
</script>
</body>
</html>
