<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Final Fix</title>
    <style>
        body { font-family: sans-serif; background: #0f1014; color: white; padding: 20px; }
        .box { background: #1c1d24; padding: 20px; border-radius: 12px; max-width: 450px; margin: auto; border: 1px solid #333; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #2a2b33; border: 1px solid #444; border-radius: 8px; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .search-btn { background: #28a745; color: white; }
        .save-btn { background: #e50914; color: white; }
    </style>
</head>
<body>

<div class="box">
    <h3>⚡ Search Movie</h3>
    <input type="text" id="movieSearchInput" placeholder="Enter Movie Name (e.g. Kick)">
    <button class="btn search-btn" onclick="fetchTMDBData()">SEARCH & FILL</button>
    <hr style="margin: 20px 0; border: 0.5px solid #333;">
    <input type="text" id="title" placeholder="Title">
    <input type="text" id="poster" placeholder="Poster URL">
    <input type="text" id="link" placeholder="Download Link">
    <textarea id="story" placeholder="Storyline..." rows="3"></textarea>
    <input type="text" id="yt" placeholder="Trailer ID">
    <button class="btn save-btn" onclick="saveToFirebase()">PUBLISH MOVIE</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
        authDomain: "movie-project-b78b4.firebaseapp.com",
        databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
        projectId: "movie-project-b78b4",
        storageBucket: "movie-project-b78b4.firebasestorage.app",
        messagingSenderId: "819696212001",
        appId: "1:819696212001:web:379b19305c6d604b2deb60"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    async function fetchTMDBData() {
        const movieName = document.getElementById('movieSearchInput').value;
        const tmdbKey = "cc9374659de08b939499a50af4715216";
        if(!movieName) return alert("Please enter a movie name!");

        try {
            const response = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${tmdbKey}&query=${encodeURIComponent(movieName)}`);
            const movieResult = await response.json();
            
            if(movieResult.results && movieResult.results.length > 0) {
                const finalData = movieResult.results[0];
                document.getElementById('title').value = finalData.title;
                document.getElementById('poster').value = "https://image.tmdb.org/t/p/w500" + finalData.poster_path;
                document.getElementById('story').value = finalData.overview;
                alert("✅ Success: Data Found!");
            } else { alert("❌ Not Found!"); }
        } catch(e) { alert("API Connection Error!"); }
    }

    function saveToFirebase() {
        const movieObj = {
            title: document.getElementById('title').value,
            poster: document.getElementById('poster').value,
            link: document.getElementById('link').value,
            story: document.getElementById('story').value,
            trailer: document.getElementById('yt').value
        };
        if(movieObj.title) {
            db.ref('movies').push(movieObj).then(() => {
                alert("✅ Published Successfully!");
                location.reload();
            });
        } else { alert("Please fill Title!"); }
    }
</script>
</body>
</html>
