<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Admin Panel | FastStream</title>
    <style>
        :root { --primary: #e50914; --bg: #0f1014; --box: #1c1d24; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; padding: 20px; margin: 0; }
        .box { background: var(--box); padding: 25px; border-radius: 12px; max-width: 600px; margin: auto; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: var(--primary); margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #2a2b33; border: 1px solid #444; border-radius: 8px; color: white; box-sizing: border-box; outline: none; }
        textarea { height: 100px; resize: none; }
        .btn { background: var(--primary); color: white; width: 100%; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        .btn:hover { background: #b20710; }
        .movie-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #333; background: #16171d; margin-bottom: 5px; border-radius: 5px; }
        label { font-size: 12px; color: #888; display: block; text-align: left; margin-top: 5px; font-weight: bold; }
        hr { border: 0; border-top: 1px solid #333; margin: 30px 0; }
    </style>
</head>
<body>

    <div id="loginBox" class="box">
        <h2>🔒 Admin Access</h2>
        <input type="password" id="pass" placeholder="Enter Admin Password">
        <button class="btn" onclick="login()">ENTER DASHBOARD</button>
    </div>

    <div id="panel" class="box" style="display:none;">
        <h2>🎬 Post New Movie</h2>
        
        <label>MOVIE TITLE</label>
        <input type="text" id="t" placeholder="e.g. Arjun Reddy (2017) Dual Audio">
        
        <label>POSTER IMAGE URL</label>
        <input type="text" id="p" placeholder="Direct link to image">
        
        <label>DOWNLOAD LINK (MONETAG)</label>
        <input type="text" id="l" placeholder="Paste your direct link here">
        
        <label>STORYLINE / DESCRIPTION</label>
        <textarea id="s" placeholder="Write a brief story about the movie..."></textarea>
        
        <label>SCREENSHOTS (Comma separated URLs)</label>
        <input type="text" id="ss" placeholder="url1.jpg, url2.jpg, url3.jpg">
        
        <label>YOUTUBE TRAILER ID</label>
        <input type="text" id="yt" placeholder="e.g. d9MyW72ELq0 (Only the ID)">

        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>QUALITY</label>
                <select id="q">
                    <option value="480p SD">480p SD</option>
                    <option value="720p HD" selected>720p HD</option>
                    <option value="1080p FHD">1080p FHD</option>
                    <option value="4K UHD">4K UHD</option>
                </select>
            </div>
            <div style="flex: 1;">
                <label>GENRE</label>
                <select id="g">
                    <option value="Action">Action</option>
                    <option value="Drama">Drama</option>
                    <option value="South Indian">South Indian</option>
                    <option value="Hindi Dubbed">Hindi Dubbed</option>
                    <option value="Horror">Horror</option>
                </select>
            </div>
        </div>

        <button class="btn" id="pubBtn" onclick="add()">PUBLISH MOVIE</button>

        <hr>

        <h3>🎥 Manage Movies</h3>
        <div id="list">Loading movies...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
            authDomain: "movie-project-b78b4.firebaseapp.com",
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
            projectId: "movie-project-b78b4",
            storageBucket: "movie-project-b78b4.firebasestorage.app",
            messagingSenderId: "819696212001",
            appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Password protection logic
        function login() { 
            const passInput = document.getElementById('pass').value;
            if(passInput === "admin123") { 
                document.getElementById('loginBox').style.display='none'; 
                document.getElementById('panel').style.display='block'; 
                loadList(); 
            } else { 
                alert("❌ Wrong Password!"); 
            }
        }

        // Add Movie to Firebase
        function add() {
            const t=document.getElementById('t').value, 
                  p=document.getElementById('p').value, 
                  l=document.getElementById('l').value,
                  s=document.getElementById('s').value,
                  ss=document.getElementById('ss').value,
                  yt=document.getElementById('yt').value,
                  q=document.getElementById('q').value,
                  g=document.getElementById('g').value;

            if(t && p && l) {
                document.getElementById('pubBtn').innerText = "Publishing...";
                db.ref('movies').push({
                    title: t, 
                    poster: p, 
                    link: l,
                    story: s,
                    screenshots: ss,
                    trailer: yt,
                    quality: q,
                    genre: g,
                    timestamp: Date.now()
                }).then(() => { 
                    alert("✅ Movie Published Successfully!"); 
                    location.reload(); 
                }).catch(err => alert("Error: " + err));
            } else { 
                alert("⚠️ Please fill Title, Poster, and Link!"); 
            }
        }

        // Load and Delete Movies
        function loadList() {
            db.ref('movies').on('value', (snap) => {
                const div = document.getElementById('list'); 
                div.innerHTML = '';
                if(!snap.exists()) { div.innerHTML = "No movies found."; return; }
                
                snap.forEach(c => {
                    const m = c.val();
                    div.innerHTML += `
                        <div class="movie-item">
                            <span style="font-size:14px;">${m.title}</span>
                            <button onclick="del('${c.key}')" style="background:red; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; font-size:12px;">Del</button>
                        </div>`;
                });
            });
        }

        function del(key) { 
            if(confirm("Are you sure you want to delete this movie?")) {
                db.ref('movies').child(key).remove(); 
            }
        }
    </script>
</body>
</html>
