<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastStream | Admin Gallery Upload</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #e50914; --bg: #0f0f0f; --card-bg: #1a1a1a; --border: #2b2b2b; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; padding-bottom: 80px; }
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .form-card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        label { font-size: 12px; color: #888; font-weight: bold; display: block; margin-top: 15px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #222; border: 1px solid var(--border); color: white; border-radius: 8px; box-sizing: border-box; }
        input[type="file"] { border: 1px dashed var(--primary); background: #111; cursor: pointer; }
        .publish-btn { width: 100%; padding: 15px; background: var(--primary); border: none; color: white; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        #status { font-size: 14px; color: #e50914; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2><i class="fas fa-images"></i> Gallery Upload Admin</h2>
        <div class="form-card">
            <label>Select Poster (Gallery)</label>
            <input type="file" id="posterFile" accept="image/*">

            <label>Movie Title</label>
            <input type="text" id="title" placeholder="Enter movie name">

            <label>Genre</label>
            <select id="genre">
                <option value="Bollywood">Bollywood</option>
                <option value="Hollywood">Hollywood</option>
                <option value="Web Series">Web Series</option>
                <option value="18+">18+</option>
            </select>

            <label>Select Screenshot (Gallery)</label>
            <input type="file" id="ssFile" accept="image/*">

            <label>Download Link</label>
            <input type="text" id="download" placeholder="Paste link here">

            <div id="status"></div>
            <button class="publish-btn" id="uploadBtn" onclick="handleUpload()">PUBLISH MOVIE</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
          authDomain: "movie-project-b78b4.firebaseapp.com",
          databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
          projectId: "movie-project-b78b4",
          storageBucket: "movie-project-b78b4.firebasestorage.app",
          messagingSenderId: "819696212001",
          appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 🚀 Imgur Upload Function (No Firebase Storage Required!)
        async function uploadToImgur(file) {
            if (!file) return "";
            const formData = new FormData();
            formData.append("image", file);

            const response = await fetch("https://api.imgur.com/3/image", {
                method: "POST",
                headers: { Authorization: "Client-ID 546c36551c0986c" }, // Public Client ID
                body: formData
            });
            const data = await response.json();
            return data.data.link;
        }

        async function handleUpload() {
            const btn = document.getElementById('uploadBtn');
            const status = document.getElementById('status');
            const posterFile = document.getElementById('posterFile').files[0];
            const ssFile = document.getElementById('ssFile').files[0];
            const title = document.getElementById('title').value;

            if (!posterFile || !title) return alert("Poster and Title are required!");

            btn.disabled = true;
            status.innerText = "Uploading Images to Server...";

            try {
                // Upload Poster and Screenshot to Imgur
                const posterUrl = await uploadToImgur(posterFile);
                const ssUrl = await uploadToImgur(ssFile);

                // Save data to Firebase Realtime Database
                const movieData = {
                    title: title,
                    poster: posterUrl,
                    genre: document.getElementById('genre').value,
                    download: document.getElementById('download').value,
                    screenshots: [ssUrl],
                    timestamp: Date.now()
                };

                await db.ref('movies').push(movieData);
                status.innerText = "Published Successfully!";
                alert("Done! Movie added to Homepage.");
                location.reload();

            } catch (error) {
                console.error(error);
                alert("Upload failed! Check internet or try again.");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
