<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastStream | Auto-Admin</title>
    <style>
        :root { --primary: #e50914; --bg: #0f1014; --box: #1c1d24; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; padding: 20px; margin: 0; }
        .box { background: var(--box); padding: 20px; border-radius: 12px; max-width: 600px; margin: 15px auto; border: 1px solid #333; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #2a2b33; border: 1px solid #444; border-radius: 8px; color: white; box-sizing: border-box; outline: none; }
        .btn { background: var(--primary); color: white; width: 100%; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-search { background: #28a745; margin-bottom: 10px; }
        .item { display: flex; justify-content: space-between; background: #16171d; padding: 12px; margin-top: 8px; border-radius: 6px; align-items: center; border-left: 3px solid var(--primary); }
    </style>
</head>
<body>

    <div class="box">
        <h2 style="color: #28a745;">⚡ Quick Auto-Fetch</h2>
        <input type="text" id="searchName" placeholder="Enter Movie Name (e.g. Pushpa 2)">
        <button class="btn btn-search" onclick="fetchMovie()">SEARCH & FILL DATA</button>
    </div>

    <div class="box">
        <h2 id="formTitle">Movie Details</h2>
        <input type="hidden" id="editKey">
        <input type="text" id="t" placeholder="Movie Title">
        <input type="text" id="p" placeholder="Poster Link">
        <input type="text" id="l" placeholder="Download Link">
        <textarea id="s" placeholder="Storyline..."></textarea>
        <input type="text" id="ss" placeholder="Screenshots (url1, url2)">
        <input type="text" id="yt" placeholder="Trailer ID Only">
        <button class="btn" onclick="saveMovie()">PUBLISH MOVIE</button>
    </div>

    <div class="box">
        <h3>🎥 Manage Movies</h3>
        <div id="list">Loading...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
            authDomain: "movie-project-b78b4.firebaseapp.com",
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
            projectId: "movie-project-b78b4",
            storageBucket: "movie-project-b78b4.firebasestorage.app",
            messagingSenderId: "819696212001",
            appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- FIXED API LOGIC ---
        async function fetchMovie() {
            const name = document.getElementById('searchName').value;
            const apiKey = "cc9374659de08b939499a50af4715216"; // Fixed Key
            
            if(!name) return alert("Please enter a movie name!");
            
            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${apiKey}&query=${encodeURIComponent(name)}`);
                const data = await res.json();
                
                if(data.results && data.results.length > 0) {
                    const movie = data.results[0];
                    const detailRes = await fetch(`https://api.themoviedb.org/3/movie/${movie.id}?api_key=${apiKey}&append_to_response=videos`);
                    const details = await detailRes.json();

                    document.getElementById('t').value = details.title + " (" + details.release_date.split('-')[0] + ")";
                    document.getElementById('p').value = "https://image.tmdb.org/t/p/w500" + details.poster_path;
                    document.getElementById('s').value = details.overview;
                    
                    const trailer = details.videos.results.find(v => v.type === 'Trailer' && v.site === 'YouTube');
                    document.getElementById('yt').value = trailer ? trailer.key : "";

                    alert("✅ Data Fetched Successfully!");
                } else {
                    alert("❌ Movie not found!");
                }
            } catch (err) { 
                alert("Error connecting to TMDB API!"); 
            }
        }

        function saveMovie() {
            const data = {
                title: document.getElementById('t').value,
                poster: document.getElementById('p').value,
                link: document.getElementById('l').value,
                story: document.getElementById('s').value,
                screenshots: document.getElementById('ss').value,
                trailer: document.getElementById('yt').value
            };
            if(data.title) {
                db.ref('movies').push(data).then(() => { alert("Success!"); location.reload(); });
            }
        }

        function load() {
            db.ref('movies').on('value', snap => {
                const list = document.getElementById('list'); list.innerHTML = '';
                snap.forEach(c => {
                    list.innerHTML += `<div class="item"><span>${c.val().title}</span><button onclick="db.ref('movies/${c.key}').remove()" style="background:red;border:none;color:white;padding:5px;border-radius:4px;">Del</button></div>`;
                });
            });
        }
        load();
    </script>
</body>
</html>
