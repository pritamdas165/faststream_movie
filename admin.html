<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #0f1014; color: white; margin: 0; padding: 20px; padding-bottom: 80px; }
        .card { background: #1c1d24; padding: 20px; border-radius: 12px; border: 1px solid #333; max-width: 500px; margin: auto; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; background: #2a2b33; border: 1px solid #444; border-radius: 8px; color: white; box-sizing: border-box; }
        .btn { background: #e50914; color: white; width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; }
        .nav a { color: #888; text-decoration: none; font-size: 12px; text-align: center; }
        .nav a.active { color: #e50914; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎬 Add Movie</h2>
        <input type="text" id="t" placeholder="Movie Title">
        <input type="text" id="p" placeholder="Poster Image URL">
        <input type="text" id="l" placeholder="Direct Link (Monetag)">
        <select id="q">
            <option value="HD 720p">HD 720p</option>
            <option value="1080p FHD">1080p FHD</option>
            <option value="4K UHD">4K UHD</option>
            <option value="Dual Audio">Dual Audio</option>
        </select>
        <button class="btn" onclick="add()">PUBLISH NOW</button>
        <p id="msg" style="text-align:center;"></p>
    </div>

    <div class="nav">
        <a href="#" class="active"><i class="fas fa-plus"></i><br>Add</a>
        <a href="index.html" target="_blank"><i class="fas fa-eye"></i><br>Site</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
            authDomain: "movie-project-b78b4.firebaseapp.com",
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
            projectId: "movie-project-b78b4",
            storageBucket: "movie-project-b78b4.firebasestorage.app",
            messagingSenderId: "819696212001",
            appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        function add(){
            const t=document.getElementById('t').value, p=document.getElementById('p').value, l=document.getElementById('l').value, q=document.getElementById('q').value;
            if(t && p && l) {
                firebase.database().ref('movies').push({title:t, poster:p, link:l, quality:q})
                .then(() => { alert("Success!"); location.reload(); });
            }
        }
    </script>
</body>
</html>
