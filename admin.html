<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | FastStream</title>
    <style>
        body { font-family: sans-serif; background: #0f1014; color: white; padding: 20px; text-align: center; }
        .box { background: #1c1d24; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; border: 1px solid #333; }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; background: #2a2b33; border: 1px solid #444; border-radius: 6px; color: white; box-sizing: border-box; }
        .btn { background: #e50914; color: white; width: 100%; padding: 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .item { display: flex; justify-content: space-between; background: #16171d; padding: 10px; margin-top: 5px; border-radius: 5px; font-size: 14px; }
    </style>
</head>
<body>
    <div id="login">
        <div class="box">
            <h2>Admin Login</h2>
            <input type="password" id="pw" placeholder="Password">
            <button class="btn" onclick="if(document.getElementById('pw').value=='admin123'){document.getElementById('main').style.display='block';document.getElementById('login').style.display='none';load()}">Login</button>
        </div>
    </div>

    <div id="main" style="display:none;">
        <div class="box">
            <h3>Post Movie</h3>
            <input type="text" id="t" placeholder="Movie Title">
            <input type="text" id="p" placeholder="Poster Image URL">
            <input type="text" id="l" placeholder="Download Link (Monetag)">
            <textarea id="s" placeholder="Storyline..."></textarea>
            <input type="text" id="ss" placeholder="Screenshots (url1, url2)">
            <input type="text" id="yt" placeholder="YouTube Trailer ID (e.g. aozErj9NqeE)">
            <button class="btn" onclick="add()">PUBLISH</button>
            <hr>
            <h3>Manage Movies</h3>
            <div id="list"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
            authDomain: "movie-project-b78b4.firebaseapp.com",
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
            projectId: "movie-project-b78b4",
            storageBucket: "movie-project-b78b4.firebasestorage.app",
            messagingSenderId: "819696212001",
            appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function add() {
            const data = {
                title: document.getElementById('t').value,
                poster: document.getElementById('p').value,
                link: document.getElementById('l').value,
                story: document.getElementById('s').value,
                screenshots: document.getElementById('ss').value,
                trailer: document.getElementById('yt').value
            };
            if(data.title && data.poster) {
                db.ref('movies').push(data).then(() => { alert("Success!"); location.reload(); });
            }
        }

        function load() {
            db.ref('movies').on('value', snap => {
                const list = document.getElementById('list'); list.innerHTML = '';
                snap.forEach(c => {
                    list.innerHTML += `<div class="item"><span>${c.val().title}</span><button onclick="db.ref('movies/${c.key}').remove()" style="background:red;border:none;color:white;cursor:pointer;border-radius:3px;">Del</button></div>`;
                });
            });
        }
    </script>
</body>
</html>
