<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastStream | Watch</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #e50914; --bg: #0f0f0f; --card-bg: #1a1a1a; --border: #2b2b2b; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; margin: 0; }
        header { padding: 15px 5%; background: rgba(0,0,0,0.8); display: flex; align-items: center; }
        .container { padding: 20px 5%; max-width: 800px; margin: 0 auto; }
        .movie-header { display: flex; gap: 20px; flex-wrap: wrap; }
        .poster-box { width: 150px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
        .poster-box img { width: 100%; }
        .screenshot-grid img { width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid var(--border); }
        .download-btn { display: block; text-align: center; padding: 15px; background: var(--primary); color: white; text-decoration: none; border-radius: 10px; font-weight: 800; margin-top: 20px; }
    </style>
</head>
<body>
    <header><a href="index.html" style="color:white; margin-right:20px;"><i class="fas fa-arrow-left"></i></a><span style="color:var(--primary); font-weight:900;">FASTSTREAM</span></header>
    <div class="container" id="details">Loading...</div>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4", authDomain: "movie-project-b78b4.firebaseapp.com", databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com", projectId: "movie-project-b78b4", storageBucket: "movie-project-b78b4.firebasestorage.app", messagingSenderId: "819696212001", appId: "1:819696212001:web:379b19305c6d604b2deb60" };
        firebase.initializeApp(firebaseConfig); const db = firebase.database();
        const id = new URLSearchParams(window.location.search).get('id');
        db.ref('movies/' + id).on('value', (snap) => {
            const m = snap.val();
            let ss = ''; m.screenshots?.forEach(s => { if(s) ss += `<img src="${s}">`; });
            document.getElementById('details').innerHTML = `
                <div class="movie-header">
                    <div class="poster-box"><img src="${m.poster}"></div>
                    <div class="info"><h1>${m.title}</h1><p>Genre: ${m.genre}</p><p>Quality: ${m.quality}</p></div>
                </div>
                <h3 style="margin-top:30px;">Screenshots</h3><div class="screenshot-grid">${ss}</div>
                <a href="${m.download}" class="download-btn">DOWNLOAD NOW</a>`;
        });
    </script>
</body>
</html>
