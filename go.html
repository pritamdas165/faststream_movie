<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastStream | Secure Link</title>
    <script>(function(s){s.dataset.zone='10626442',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
    <style>
        body { background: #0a0a0b; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .box { background: #161618; padding: 30px; border-radius: 15px; border: 1px solid #e50914; max-width: 300px; }
        .btn { background: #e50914; color: white; padding: 15px 25px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h3>Link is Ready!</h3>
        <p>Click below to continue to your movie.</p>
        <a id="finalLink" class="btn">CONTINUE TO MOVIE</a>
    </div>

    <script>
        // URL theke real link-ti ber kora
        const urlParams = new URLSearchParams(window.location.search);
        const encodedUrl = urlParams.get('url');
        if (encodedUrl) {
            const finalUrl = atob(encodedUrl); // Base64 decode
            document.getElementById('finalLink').href = finalUrl;
        } else {
            document.getElementById('finalLink').innerText = "Link Expired";
        }
    </script>
</body>
</html>
