<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 1</title>
    <style>
        body { background: #050505; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .card { background: #111; padding: 30px; border-radius: 20px; border: 1px solid #222; width: 90%; max-width: 380px; }
        .btn { display: block; background: #e50914; color: white; padding: 18px; border-radius: 12px; text-decoration: none; font-weight: bold; cursor: pointer; border: none; width: 100%; margin-top: 20px; }

<body>
    <div class="card">
        <h2>Verification Step 1</h2>

        <a id="next" href="#" class="btn">CONTINUE TO STEP 2</a>

    <script>
        const id = new URLSearchParams(window.location.search).get('id');
        document.getElementById('adBtn').onclick = function() {

            this.style.display = "none";

            next.href = "verify.html?id=" + id;
