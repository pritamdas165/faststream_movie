<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details | FastStream</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #e50914; --bg: #0a0a0b; --card: #161618; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; padding-bottom: 50px; }
        .container { max-width: 600px; margin: auto; }
        .poster { width: 100%; border-radius: 12px; box-shadow: 0 0 20px rgba(229, 9, 20, 0.3); }
        h1 { color: var(--primary); font-size: 22px; margin: 15px 0; line-height: 1.4; }
        .section-title { border-left: 4px solid var(--primary); padding-left: 10px; margin: 25px 0 10px; font-weight: bold; font-size: 18px; }
        .content-box { background: var(--card); padding: 15px; border-radius: 10px; color: #ccc; line-height: 1.6; font-size: 15px; }
        
        /* Screenshot Grid Fix */
        .ss-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .ss-grid img { width: 100%; border-radius: 8px; border: 1px solid #333; transition: 0.3s; }
        
        .dl-btn { display: block; background: var(--primary); color: white; text-align: center; padding: 16px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 30px; font-size: 18px; }
        iframe { border-radius: 10px; width: 100%; height: 210px; background: #000; }
    </style>
</head>
<body>
    <div class="container">
        <img id="mPoster" class="poster" src="">
        <h1 id="mTitle">Loading...</h1>
        
        <div class="section-title">Storyline</div>
        <div id="mStory" class="content-box"></div>

        <div class="section-title">Watch Trailer</div>
        <div id="mTrailer"></div>

        <div class="section-title">Screen-Shots</div>
        <div id="mScreenshots" class="ss-grid"></div>

        <a id="mDownload" class="dl-btn"><i class="fas fa-download"></i> DOWNLOAD MOVIE (HD)</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
            authDomain: "movie-project-b78b4.firebaseapp.com",
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
            projectId: "movie-project-b78b4",
            storageBucket: "movie-project-b78b4.firebasestorage.app",
            messagingSenderId: "819696212001",
            appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const mId = new URLSearchParams(window.location.search).get('id');
        if(mId) {
            db.ref('movies/' + mId).on('value', (snap) => {
                const m = snap.val();
                if(!m) return;
                document.getElementById('mTitle').innerText = m.title;
                document.getElementById('mPoster').src = m.poster;
                document.getElementById('mStory').innerText = m.story || "No storyline available.";
                document.getElementById('mDownload').href = m.link;
                
                // Trailer ID Fix
                if(m.trailer) {
                    let ytId = m.trailer.trim();
                    // Jodi bhule full link den, tobe ID extract hobe
                    if(ytId.includes('v=')) ytId = ytId.split('v=')[1].split('&')[0];
                    else if(ytId.includes('youtu.be/')) ytId = ytId.split('/').pop().split('?')[0];

                    document.getElementById('mTrailer').innerHTML = `
                        <iframe src="https://www.youtube.com/embed/${ytId}" frameborder="0" allowfullscreen></iframe>`;
                }

                // Screenshot Grid Logic
                if(m.screenshots) {
                    const ss = m.screenshots.split(',');
                    const grid = document.getElementById('mScreenshots');
                    grid.innerHTML = '';
                    ss.forEach(url => {
                        if(url.trim()) grid.innerHTML += `<img src="${url.trim()}">`;
                    });
                }
            });
        }
    </script>
</body>
</html>
