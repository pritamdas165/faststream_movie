<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details | FastStream</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #0a0a0b; color: white; margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: auto; }
        .poster { width: 100%; border-radius: 12px; box-shadow: 0 0 15px rgba(229, 9, 20, 0.4); }
        h1 { color: #e50914; font-size: 24px; margin: 15px 0; }
        .section-title { border-left: 4px solid #e50914; padding-left: 10px; margin: 20px 0 10px; font-weight: bold; }
        .content-box { background: #161618; padding: 15px; border-radius: 10px; color: #ccc; line-height: 1.6; }
        .ss-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .ss-grid img { width: 100%; border-radius: 5px; }
        .dl-btn { display: block; background: #e50914; color: white; text-align: center; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <img id="mPoster" class="poster">
        <h1 id="mTitle">Loading...</h1>
        
        <div class="section-title">Storyline</div>
        <div id="mStory" class="content-box">No storyline available.</div>

        <div class="section-title">Watch Trailer</div>
        <div id="mTrailer"></div>

        <div class="section-title">Screen-Shots</div>
        <div id="mScreenshots" class="ss-grid"></div>

        <a id="mDownload" class="dl-btn">DOWNLOAD MOVIE (HD)</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
            authDomain: "movie-project-b78b4.firebaseapp.com",
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
            projectId: "movie-project-b78b4",
            storageBucket: "movie-project-b78b4.firebasestorage.app",
            messagingSenderId: "819696212001",
            appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const mId = new URLSearchParams(window.location.search).get('id');
        if(mId) {
            db.ref('movies/' + mId).on('value', (snap) => {
                const m = snap.val();
                document.getElementById('mTitle').innerText = m.title;
                document.getElementById('mPoster').src = m.poster;
                document.getElementById('mStory').innerText = m.story || "No storyline found.";
                document.getElementById('mDownload').href = m.link;
                
                if(m.trailer) {
                    document.getElementById('mTrailer').innerHTML = `<iframe width="100%" height="200" src="https://www.youtube.com/embed/${m.trailer}" frameborder="0" allowfullscreen></iframe>`;
                }
                if(m.screenshots) {
                    const ss = m.screenshots.split(',');
                    const grid = document.getElementById('mScreenshots');
                    grid.innerHTML = '';
                    ss.forEach(url => { grid.innerHTML += `<img src="${url.trim()}">`; });
                }
            });
        }
    </script>
</body>
</html>
