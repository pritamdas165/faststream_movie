<div class="container" style="max-width: 700px; margin: auto; background: #0a0a0b; color: white; padding: 20px;">
    <img id="mPoster" style="width: 100%; border-radius: 10px;">
    <h1 id="mTitle" style="color: #e50914; margin-top: 15px;"></h1>
    
    <div style="margin: 10px 0;">
        <span id="mGenre" style="background: #333; padding: 5px 12px; border-radius: 5px; font-size: 13px;"></span>
        <span style="background: #333; padding: 5px 12px; border-radius: 5px; font-size: 13px; margin-left: 5px;">2026</span>
    </div>

    <h3 style="border-left: 4px solid #e50914; padding-left: 10px;">Storyline</h3>
    <p id="mStory" style="color: #ccc; line-height: 1.6;"></p>

    <h3 style="border-left: 4px solid #e50914; padding-left: 10px;">Watch Trailer</h3>
    <div id="ytPlayer"></div>

    <h3 style="border-left: 4px solid #e50914; padding-left: 10px;">Screen-Shots</h3>
    <div id="ssGrid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></div>

    <div style="margin-top: 30px;">
        <a id="dlBtn" style="display: block; background: #e50914; color: white; text-align: center; padding: 15px; border-radius: 8px; font-weight: bold; text-decoration: none;">DOWNLOAD MOVIE (HD)</a>
    </div>
</div>

<script>
    // URL theke Movie ID niye database theke data fetch korte hobe
    // (Ami simplified logic dichhi)
    const urlParams = new URLSearchParams(window.location.search);
    const mId = urlParams.get('id'); // Jakhon index theke pathaben, id=... diye pathaben

    db.ref('movies/' + mId).on('value', (snap) => {
        const m = snap.val();
        document.getElementById('mTitle').innerText = m.title;
        document.getElementById('mPoster').src = m.poster;
        document.getElementById('mStory').innerText = m.story;
        document.getElementById('mGenre').innerText = m.genre;
        document.getElementById('dlBtn').href = m.link;
        
        // Trailer setup
        if(m.trailer) {
            document.getElementById('ytPlayer').innerHTML = `<iframe width="100%" height="315" src="https://www.youtube.com/embed/${m.trailer}" frameborder="0" allowfullscreen></iframe>`;
        }
        
        // Screenshot grid
        if(m.screenshots) {
            const imgs = m.screenshots.split(',');
            const grid = document.getElementById('ssGrid');
            imgs.forEach(url => {
                grid.innerHTML += `<img src="${url.trim()}" style="width:100%; border-radius:5px;">`;
            });
        }
    });
</script>
