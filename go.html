<div class="dl-container">
    <a id="mDownload" class="dl-btn">
        <i class="fas fa-cloud-download-alt"></i> GO TO DOWNLOAD PAGE
    </a>
</div>

<script>
    // ... apnar purono firebase config thakbe ...
    const mId = new URLSearchParams(window.location.search).get('id');
    if(mId) {
        db.ref('movies/' + mId).on('value', (snap) => {
            const m = snap.val();
            if(!m) return;
            // Button-e shudhu redirect link hobe
            document.getElementById('mDownload').href = `download.html?id=${mId}`;
        });
    }
</script>
