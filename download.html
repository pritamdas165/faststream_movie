<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://quge5.com/88/tag.min.js" data-zone="212786" async data-cfasync="false"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Link - Fast8Movie</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { background: #151515; padding: 30px; border-radius: 20px; border: 1px solid #222; text-align: center; width: 85%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .timer { font-size: 3rem; color: #e50914; margin: 20px 0; font-weight: bold; }
        .btn { display: none; background: #e50914; color: white; padding: 15px; border-radius: 10px; text-decoration: none; font-weight: bold; cursor: pointer; border: none; width: 100%; font-size: 1rem; }
        .btn:hover { background: #b20710; }
    </style>
</head>
<body>

    <div class="box">
        <div style="margin-bottom: 20px;">
            <script>(function(s){s.dataset.zone='10632678',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
        </div>
        
        <h3 id="msg">Generating Secure Link...</h3>
        <div class="timer" id="t">10</div>
        
        <a id="b" href="https://omg10.com/4/10626413" target="_blank" class="btn">START DOWNLOAD NOW</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // 1. Firebase Config (Only Once)
        const firebaseConfig = { 
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4", 
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. Get ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');

        // 3. Main Logic
        if (movieId) {
            db.ref('movies/' + movieId).once('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    const finalDownloadUrl = data.download;
                    let timeLeft = 10;
                    const timerText = document.getElementById('t');
                    const downloadBtn = document.getElementById('b');

                    const timerInterval = setInterval(() => {
                        timeLeft--;
                        timerText.innerText = timeLeft;

                        if (timeLeft <= 0) {
                            clearInterval(timerInterval);
                            timerText.style.display = 'none';
                            document.getElementById('msg').innerText = "Link Ready!";
                            downloadBtn.style.display = 'block';

                            // 4. Click Handler: Open Ad first, then Download
                            downloadBtn.onclick = function() {
                                setTimeout(() => {
                                    window.location.href = finalDownloadUrl;
                                }, 1500); 
                            };
                        }
                    }, 1000);
                } else {
                    document.getElementById('msg').innerText = "Movie Not Found!";
                }
            });
        } else {
            document.getElementById('msg').innerText = "Invalid Request!";
        }
    </script>
</body>
</html>
