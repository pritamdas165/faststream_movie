<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast8Movie | Fast Download</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #e50914; --bg: #0a0a0a; --card-bg: #151515; --border: #222; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        header { width: 100%; padding: 15px 0; background: #000; text-align: center; border-bottom: 1px solid var(--border); }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--primary); text-decoration: none; }

        .download-box { 
            width: 90%; max-width: 500px; background: var(--card-bg); 
            margin-top: 50px; padding: 30px; border-radius: 20px; 
            border: 1px solid var(--border); text-align: center; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
        }
        
        .movie-mini-info { display: flex; align-items: center; gap: 15px; text-align: left; margin-bottom: 25px; background: #0c0c0c; padding: 10px; border-radius: 12px; }
        .movie-mini-info img { width: 60px; height: 80px; object-fit: cover; border-radius: 8px; }
        .movie-mini-info h3 { font-size: 1rem; margin: 0; color: #eee; }

        .timer-circle { width: 80px; height: 80px; border: 4px solid #333; border-top: 4px solid var(--primary); border-radius: 50%; margin: 20px auto; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.5rem; transition: 0.3s; }
        
        .link-btn { 
            display: none; padding: 18px; background: var(--primary); 
            color: white; text-decoration: none; border-radius: 12px; 
            font-weight: 900; font-size: 1.1rem; transition: 0.3s; 
            animation: fadeIn 0.5s ease;
        }
        .link-btn:hover { transform: scale(1.03); background: #b20710; }

        .server-list { margin-top: 20px; text-align: left; font-size: 13px; color: #888; }
        .server-item { padding: 10px 0; border-bottom: 1px solid #222; display: flex; justify-content: space-between; }
        .server-item span { color: #28a745; font-weight: bold; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">FAST8MOVIE</a>
    </header>

    <div class="download-box">
        <div id="movie-preview" class="movie-mini-info">
            <img id="m-poster" src="https://via.placeholder.com/150" alt="">
            <div>
                <h3 id="m-title">Loading Movie...</h3>
                <span style="font-size: 12px; color: #666;">High Speed Download Server</span>
            </div>
        </div>

        <p id="wait-msg" style="color: #aaa; font-size: 14px;">Please wait, your secure link is generating...</p>
        
        <div id="timer" class="timer-circle">10</div>

        <a id="download-link" href="#" class="link-btn">
            <i class="fas fa-bolt"></i> START DOWNLOAD NOW
        </a>

        <div class="server-list">
            <div class="server-item">Server Status: <span>Online</span></div>
            <div class="server-item">File Quality: <span>Ultra HD</span></div>
            <div class="server-item">Encryption: <span>SSL Secured</span></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4",
            authDomain: "movie-project-b78b4.firebaseapp.com",
            databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com",
            projectId: "movie-project-b78b4",
            storageBucket: "movie-project-b78b4.firebasestorage.app",
            messagingSenderId: "819696212001",
            appId: "1:819696212001:web:379b19305c6d604b2deb60"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        if (id) {
            db.ref('movies/' + id).once('value', (snap) => {
                const m = snap.val();
                if (m) {
                    document.getElementById('m-title').innerText = m.title;
                    document.getElementById('m-poster').src = m.poster;
                    document.getElementById('download-link').href = m.download;
                    startTimer();
                }
            });
        }

        function startTimer() {
            let timeLeft = 10;
            const timerEl = document.getElementById('timer');
            const downloadBtn = document.getElementById('download-link');
            const waitMsg = document.getElementById('wait-msg');

            const countdown = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerEl.style.display = 'none';
                    waitMsg.innerText = "Link Generated Successfully!";
                    waitMsg.style.color = "#28a745";
                    downloadBtn.style.display = 'block';
                }
            }, 1000);
        }
    </script>
</body>
</html>
