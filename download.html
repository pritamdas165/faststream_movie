<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Download</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .box { background: #151515; padding: 30px; border-radius: 20px; border: 1px solid #222; width: 90%; max-width: 400px; }
        .timer { font-size: 3rem; font-weight: bold; color: #e50914; margin: 20px 0; }
        .btn-final { display: none; background: #e50914; color: white; padding: 15px; border-radius: 10px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h3>Generating Secure Link...</h3>
        <div class="timer" id="timer">10</div>
        <a id="final-btn" class="btn-final" href="#">START DOWNLOAD</a>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDosgWhpc2fkwlyKKP73arZyfaETDUGzY4", databaseURL: "https://movie-project-b78b4-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const id = new URLSearchParams(window.location.search).get('id');
        if(id) {
            firebase.database().ref('movies/' + id).once('value', snap => {
                document.getElementById('final-btn').href = snap.val().download;
                let time = 10;
                const inter = setInterval(() => {
                    time--; document.getElementById('timer').innerText = time;
                    if(time <= 0) {
                        clearInterval(inter);
                        document.getElementById('timer').style.display = 'none';
                        document.getElementById('final-btn').style.display = 'block';
                    }
                }, 1000);
            });
        }
    </script>
</body>
</html>
