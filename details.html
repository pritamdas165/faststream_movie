<style>
    .screen-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 20px 0; }
    .screen-grid img { width: 100%; border-radius: 8px; border: 1px solid #333; }
    
    .quality-box { background: #111; padding: 20px; border-radius: 15px; border: 1px solid #222; margin-top: 20px; }
    .quality-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #222; }
    .quality-row:last-child { border: none; }
    .q-btn { background: #e50914; color: white; padding: 8px 15px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: bold; }
    .q-info { font-size: 14px; color: #ccc; }
    .q-info span { color: #888; font-size: 11px; display: block; }
</style>

<div class="content">
    <img id="poster" class="poster" src="">
    <h1 id="title">Loading...</h1>
    
    <div class="desc">
        <h3>Storyline</h3>
        <p id="movie-desc"></p>
    </div>

    <h3>Screenshots</h3>
    <div class="screen-grid" id="screen-container"></div>

    <div class="quality-box">
        <h3>Download Links</h3>
        <div id="links-container"></div>
    </div>
</div>

<script>
    firebase.database().ref('movies/' + id).once('value', snap => {
        const m = snap.val();
        document.getElementById('poster').src = m.poster;
        document.getElementById('title').innerText = m.title;
        document.getElementById('movie-desc').innerText = m.desc || "No description available.";

        // Screenshots Display
        if(m.screens) {
            const ss = m.screens.split(',');
            document.getElementById('screen-container').innerHTML = ss.map(url => `<img src="${url.trim()}">`).join('');
        }

        // Quality Links Logic
        const qualities = [
            { label: '480p - SD', size: '400MB', link: m.link480 },
            { label: '720p - HD', size: '1.2GB', link: m.link720 },
            { label: '1080p - Full HD', size: '2.5GB', link: m.link1080 },
            { label: '4K - Ultra HD', size: '5GB', link: m.link4K }
        ];

        let linkHTML = "";
        qualities.forEach(q => {
            if(q.link) {
                linkHTML += `
                <div class="quality-row">
                    <div class="q-info">${q.label} <span>Size: ${q.size}</span></div>
                    <a href="go.html?id=${id}&q=${btoa(q.link)}" class="q-btn">DOWNLOAD</a>
                </div>`;
            }
        });
        document.getElementById('links-container').innerHTML = linkHTML;
    });
</script>
