<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Movie | FastStream</title>
    <style>
        body { background: #080808; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin:0; }
        .req-box { background: #141414; padding: 40px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #333; }
        h2 { color: #e50914; margin-bottom: 25px; }
        input { width: 100%; padding: 15px; margin-bottom: 20px; background: #222; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        button { background: #e50914; color: white; padding: 15px; border: none; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="req-box">
        <h2>REQUEST MOVIE</h2>
        <input type="text" id="mName" placeholder="Type Movie Name...">
        <button onclick="sendReq()">SUBMIT REQUEST</button>
        <p><a href="index.html" style="color:#666; text-decoration:none; font-size:14px;">Back to Home</a></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        // Use your firebaseConfig here
        const firebaseConfig = { /* Paste your Config Here */ };
        firebase.initializeApp(firebaseConfig);
        function sendReq() {
            const m = document.getElementById('mName').value;
            if(!m) return alert("Please enter movie name!");
            firebase.database().ref('requests').push({ movie: m, date: new Date().toLocaleString() })
            .then(() => { alert("Thank you! We received your request."); document.getElementById('mName').value = ""; });
        }
    </script>
</body>
</html>
