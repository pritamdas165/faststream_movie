<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Movie | FastStream</title>
    <style>
        body { font-family: sans-serif; background: #000; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #141414; padding: 30px; border-radius: 8px; width: 90%; max-width: 400px; text-align: center; }
        h2 { color: #e50914; }
        input { width: 100%; padding: 12px; margin: 15px 0; background: #333; border: none; color: white; border-radius: 4px; box-sizing: border-box; }
        button { background: #e50914; color: white; border: none; width: 100%; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Request a Movie</h2>
        <input type="text" id="reqMovie" placeholder="Enter Movie Name...">
        <button onclick="sendRequest()">SEND REQUEST</button>
        <p><a href="index.html" style="color: #aaa; text-decoration: none; font-size: 14px;">Back to Home</a></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { /* Apnar Config */ };
        firebase.initializeApp(firebaseConfig);
        function sendRequest() {
            const m = document.getElementById('reqMovie').value;
            if(!m) return alert("Please enter a name!");
            firebase.database().ref('requests').push({ movieName: m, time: new Date().toLocaleString() })
            .then(() => { alert("Request Sent! We will add it soon."); document.getElementById('reqMovie').value = ""; });
        }
    </script>
</body>
</html>
